function ghQueueSave(){ghDirty=true;ghRememberDraft();clearTimeout(ghTimer);if(!ghReady||!ghToken){ghSetMessage('修改尚未同步，請先連線並設定 GitHub 編輯授權');return}if(ghConflict){ghSetMessage('共同編輯衝突，修改已保留在此手機');return}ghSetMessage('待同步到 GitHub…');ghTimer=setTimeout(()=>ghPush().catch(()=>{}),1500)}
async function ghPush(){if(ghBusy||!ghDirty||!ghReady||!ghToken||ghConflict)return;ghBusy=true;const generation=ghGeneration;try{ghSetMessage('正在寫入 GitHub…');for(let attempt=0;attempt<3;attempt++){const current=await ghRead();if(!current)throw Error('共用檔案已不存在，未寫入任何資料');if(generation!==ghGeneration)return;const sent=structuredClone(db),base=structuredClone(ghBase),merged=validDb(ghMerge(base,sent,current.data));let written;try{written=await ghApi('PUT',{message:'更新旅行行程',branch:ghConfig.branch,sha:current.sha,content:ghEncode(merged)})}catch(e){if(e.conflict&&attempt<2)continue;throw e}if(generation!==ghGeneration)return;ghBase=structuredClone(merged);ghSha=written.content.sha;const newer=structuredClone(db);try{db=validDb(ghMerge(sent,newer,merged))}catch{ghConflict=true;throw Error('此手機在同步期間改動了相同資料，請保留備份後重新載入')}ghDirty=!sameJson(db,ghBase);ghRememberDraft();active();if(!sameJson(sent,merged)&&!document.activeElement?.matches('input,textarea,select'))render();else if(tab==='trip'){refreshTableComputed();ghRefreshFields()};ghSetMessage(ghDirty?'還有修改待同步…':'已同步到 GitHub');break}}catch(e){ghConflict=/共同編輯衝突|同步期間/.test(e.message);ghRememberDraft();ghSetMessage(e.message);if(!ghConflict)ghSetMessage(e.message+'；修改已保留，可按同步重試')}finally{ghBusy=false;if(ghDirty&&!ghConflict&&ghReady&&ghToken&&ghMessage==='還有修改待同步…')ghTimer=setTimeout(()=>ghPush().catch(()=>{}),1500)}}
async function ghConnect(){if(!ghConfig)return;ghBusy=true;ghReady=false;const generation=ghGeneration;try{ghSetMessage('正在讀取 GitHub 共用資料…');const remote=await ghRead();if(generation!==ghGeneration)return;if(!remote){ghBase=null;ghSha=null;ghSetMessage('尚無共用資料：請先把 travel.json 上傳到私人儲存庫根目錄，或建立空白旅程');render();return}let draft=null;try{const saved=JSON.parse(ghStored(localStorage,GH_DRAFT_KEY)||'null');if(saved&&ghConfigId(saved.config)===ghConfigId())draft=saved}catch{}ghBase=structuredClone(remote.data);ghSha=remote.sha;ghReady=true;ghConflict=false;if(draft&&draft.base){try{db=validDb(ghMerge(draft.base,draft.local,remote.data));ghDirty=!sameJson(db,remote.data)}catch(e){db=validDb(draft.local);ghBase=draft.base;ghDirty=true;ghConflict=true;ghSetMessage(e.message)}}else{db=remote.data;ghDirty=false}active();ghRememberDraft();render();ghSetMessage(ghConflict?'共同編輯衝突，修改已保留在此手機':ghDirty?'有本機修改待同步':ghToken?'已連線 GitHub，可共同編輯':'已讀取 GitHub；設定授權碼後可編輯');if(ghDirty&&!ghConflict&&ghToken)ghTimer=setTimeout(()=>ghPush().catch(()=>{}),1500)}catch(e){ghReady=false;ghSetMessage(e.message);render()}finally{ghBusy=false;ghSchedulePoll()}}
function ghSchedulePoll(){clearTimeout(ghPollTimer);if(ghConfig)ghPollTimer=setTimeout(()=>ghPoll(),ghToken?15000:120000)}
async function ghPoll(){try{if(ghDirty&&!ghConflict&&ghReady&&ghToken&&!ghBusy){await ghPush();return}if(!ghReady||ghBusy||ghDirty||document.hidden||document.activeElement?.matches('input,textarea,select'))return;ghBusy=true;const generation=ghGeneration,remote=await ghRead();if(generation!==ghGeneration||ghDirty)return;if(!remote)throw Error('共用資料已不存在');if(remote.sha!==ghSha){db=remote.data;ghBase=structuredClone(db);ghSha=remote.sha;undoState=null;active();render();ghSetMessage('已取得其他手機的更新')}}catch(e){ghSetMessage(e.message)}finally{ghBusy=false;ghSchedulePoll()}}
async function ghInitialize(){if(ghBusy||!ghConfig||!ghToken){toast('請先填入 GitHub 編輯授權碼');return}ghBusy=true;try{const exists=await ghRead();if(exists){ghSetMessage('共用資料已存在，會讀取既有版本')}else {const value=validDb(structuredClone(db));await ghApi('PUT',{message:'建立旅行共用資料',branch:ghConfig.branch,content:ghEncode(value)});ghDirty=false;ghRememberDraft()}}catch(e){ghSetMessage(e.message);return}finally{ghBusy=false}await ghConnect()}
function githubSettings(){return `<h2>GitHub 共用資料</h2><p>所有手機讀寫同一份私人 JSON。請填私人資料儲存庫網址，不是公開網站的儲存庫。</p><p class="muted" data-gh-status>${esc(ghMessage)}</p><form id="githubForm">${field('GitHub 儲存庫網址','name="repository"',ghConfig?'https://github.com/'+ghConfig.owner+'/'+ghConfig.repo:'','url','required placeholder="https://github.com/帳號/儲存庫"')}<details><summary>分支與資料檔案</summary>${field('分支','name="branch"',ghConfig?.branch||'main')}${field('JSON 路徑','name="path"',ghConfig?.path||'travel.json')}</details>${field('此手機的 GitHub 存取授權碼','name="token" autocomplete="off"',ghToken,'password')}<p class="muted">使用限此儲存庫的 fine-grained token，Contents 設為 Read and write。授權碼只留在目前分頁，關閉後需重新填寫；不會包含在下載 HTML 或共用 JSON。請勿把授權碼貼到對話或上傳 GitHub。</p><button class="primary">儲存設定並連線</button></form><div class="toolbar"><button data-action="gh-initialize">建立空白共用資料（已有 travel.json 不用按）</button><button data-action="gh-sync">立即同步</button><button data-action="gh-reload">重新載入 GitHub 版本</button><button data-action="download">下載此手機備份</button><button data-action="gh-forget">清除此手機授權</button></div><p class="muted">共同修改不同欄位會合併；同一欄位衝突時保留此手機修改並提示，不自動覆蓋。</p>`}
async function ghConfigure(v){const config=ghParseConfig(v.repository,v.branch||'main',v.path||'travel.json');if(ghBusy)throw Error('同步處理中，請稍後再更換設定');if(ghDirty&&ghConfigId(config)!==ghConfigId())throw Error('仍有修改未同步，請先同步或下載備份再更換儲存庫');ghValidateToken((v.token||'').trim());ghGeneration++;clearTimeout(ghTimer);ghConfig=config;ghToken=(v.token||'').trim();localStorage.setItem(GH_CONFIG_KEY,JSON.stringify(config));try{if(ghToken)sessionStorage.setItem(GH_TOKEN_KEY,ghToken);else sessionStorage.removeItem(GH_TOKEN_KEY)}catch{}await ghConnect()}
function ghLoadConfig(){try{const embedded=JSON.parse(document.getElementById('travel-github-config').textContent),saved=JSON.parse(ghStored(localStorage,GH_CONFIG_KEY)||'null');if(saved||embedded){const c=saved||embedded;ghConfig=ghParseConfig('https://github.com/'+c.owner+'/'+c.repo,c.branch,c.path)}}catch{}ghToken=ghStored(sessionStorage,GH_TOKEN_KEY)||''}
window.addEventListener('beforeunload',e=>{if(ghDirty){e.preventDefault();e.returnValue=''}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)ghPoll()});

function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch{}ghQueueSave()}
function snapshot(){undoState=structuredClone(db)}
function commit(){save();render()}
function getRow(id){for(const d of state.days){const i=d.rows.findIndex(r=>r.id===id);if(i>=0)return {d,r:d.rows[i],i}}throw Error('找不到行程')}
function mapUrl(place){return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(place)}
function rowMapUrl(r){return safeUrl(r.mapLink)||mapUrl(r.place||r.name)}
function routePoints(id){const {d,r,i}=getRow(id),next=d.rows[i+1];return {origin:r.place||r.name,destination:next?(next.place||next.name):''}}
function routeUrl(id){const {r}=getRow(id),p=routePoints(id);return 'https://www.google.com/maps/dir/?'+new URLSearchParams({api:'1',origin:p.origin,destination:p.destination,travelmode:r.mode||'transit'})}
function options(arr,val){return arr.map(x=>`<option value="${esc(x)}" ${x===val?'selected':''}>${esc(x)}</option>`).join('')}
function field(label,key,value,type='text',extra=''){return `<label class="field">${label}<input type="${type}" value="${esc(value)}" ${key} ${extra}></label>`}
function area(label,key,value,cls=''){return `<label class="field">${label}<textarea class="${cls}" ${key}>${esc(value)}</textarea></label>`}
function outLink(url,label,cls=''){return `<a class="link ${cls}" href="${esc(safeUrl(url))}" target="_blank" rel="noopener noreferrer">${label}</a>`}
function linkifyText(text){const re=/(https?:\/\/[^\s<]+)/gi;let out='',last=0;for(const m of String(text||'').matchAll(re)){out+=esc(String(text).slice(last,m.index));const raw=m[0],clean=raw.replace(/[),.;!?，。；！？]+$/,'');out+=`<a class="inline-url" href="${esc(safeUrl(clean))}" target="_blank" rel="noopener noreferrer">${esc(clean)}</a>`+esc(raw.slice(clean.length));last=m.index+raw.length}return out+esc(String(text||'').slice(last))}
function linkBackup(entries){return entries.map(([label,url])=>`<div class="link-backup"><label class="field">${esc(label)}<input readonly aria-label="${esc(label)}網址" value="${esc(safeUrl(url))}"></label><div class="info-actions"><button data-action="copy-link" type="button">複製網址</button><a class="link" href="${esc(safeUrl(url))}" target="_top" rel="noreferrer">在原視窗開啟</a></div></div>`).join('')}
async function copyLink(button){const input=button.closest('.link-backup').querySelector('input');try{if(!navigator.clipboard)throw Error('clipboard');await navigator.clipboard.writeText(input.value);toast('網址已複製，可貼到 Safari 或 Chrome 開啟')}catch{input.focus();input.select();input.setSelectionRange(0,input.value.length);toast('已選取網址，請長按複製後貼到瀏覽器')}}
function go(t){if(t==='table')t='trip';if(t==='food')t='more';if(t!==tab)pageHistory.push(tab);tab=t;render();window.scrollTo({top:0})}
function backPage(){tab=pageHistory.pop()||'more';render();window.scrollTo({top:0})}
function pageBack(){return '<div class="page-back no-print"><button data-action="back-page">‹ 回到前一頁</button></div>'}
function dayPicker(){return `<div class="day-picker"><button data-action="prev-day" aria-label="前一天" ${dayIndex===0?'disabled':''}>‹</button><select aria-label="選擇日期" data-select-day>${state.days.map((d,i)=>`<option value="${i}" ${i===dayIndex?'selected':''}>DAY ${i+1} · ${esc(d.date.slice(5).replace('-','/'))} · ${esc(d.title)}</option>`).join('')}</select><button data-action="next-day" aria-label="後一天" ${dayIndex===state.days.length-1?'disabled':''}>›</button></div>`}
function render(){if(!ghReady||!ghToken){document.title='私人旅程手帖';$('#tripName').textContent='私人旅程手帖';$('#tripMeta').textContent='授權後讀取私人行程';$('#nav').innerHTML='';$('#main').innerHTML=ghBanner()+githubSettings();autoSize();return}active();document.title=state.name+'｜旅程手帖';$('#tripName').textContent=state.name;$('#tripMeta').textContent=state.destination||'我的旅程';$('#nav').innerHTML=tabs.map(([id,icon,name])=>`<button data-tab="${id}" class="${id===tab||id==='lists'&&['luggage','todo'].includes(tab)||id==='more'&&['github','flights','refs','backup','journeys','trip'].includes(tab)?'active':''}"><span>${icon}</span>${name}</button>`).join('');$('#main').innerHTML=ghBanner()+(['github','flights','refs','backup','journeys','trip'].includes(tab)?pageBack():'')+({trip,schedule,info,lists:lists,luggage:()=>checklist('luggage'),todo:()=>checklist('todo'),more,github:githubSettings,flights,refs,book,backup,journeys}[tab]||book)();autoSize();ghReadOnly();if(tab==='schedule')requestAnimationFrame(layoutSchedules)}
function cleanTransitLine(s){return String(s).replace(/\*\*/g,'').replace(/^#{1,6}\s*/,'').replace(/\[([^\]]+)\]\([^)]*\)/g,'$1').replace(/https?:\/\/\S+/g,'').replace(/\u00a0/g,' ').replace(/[ \t]+/g,' ').trim()}
function summarizeGoogleTransit(raw){
 const original=String(raw||'').replace(/\r/g,'');
 let lines=original.split(/\n+/).map(cleanTransitLine).filter(Boolean);
 lines=lines.filter(x=>!/^id=[\w-]+$/i.test(x)&&!(/^(上午|下午)?\s*\d{1,2}:\d{2}$/.test(x))&&!/^[-–—]+$/.test(x)&&!/^日本(?:〒|\s|$)/.test(x)&&!/^〒\d/.test(x));
 const modes='火車|電車|地鐵|捷運|巴士|公車|步行|走路|開車|汽車|計程車';
 const isMode=x=>new RegExp(`^(?:${modes})$`).test(x);
 const isAddress=x=>/^(?:日本)?〒?\d{3}-?\d{4}\b/.test(x)||/\b(?:Japan|Osaka|Kyoto|Tokyo)\b.*\d/i.test(x);
 const normalizeTransitNums=x=>String(x||'').replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/／/g,'/');
 const timeInfo=x=>{const z=normalizeTransitNums(x);const mins=z.match(/(?:約\s*)?(\d+)\s*分(?:鐘)?/),stops=z.match(/[（(]\s*(\d+)\s*站\s*[)）]/);return mins?{mins:Number(mins[1]),stops:stops?Number(stops[1]):null}:null};
 const platformInfo=x=>{const z=normalizeTransitNums(x);const m=z.match(/(\d+(?:\s*\/\s*\d+)*)\s*(?:號月台|番線)/);return m?m[1].replace(/\s/g,''):''};
 const distanceInfo=x=>{const m=String(x).match(/(\d+(?:[.,]\d+)?)\s*(公尺|米|m|公里|km)(?![A-Za-z])/i);if(!m)return '';const unit=/公里|km/i.test(m[2])?'公里':'公尺';return `${m[1].replace(',','')}${unit}`};
 const splitInline=x=>{const m=String(x).match(new RegExp(`^(${modes})(.+)$`));return m?{mode:m[1],rest:m[2].trim()}:null};
 const formatRoute=route=>{route=String(route||'').replace(new RegExp(`^(?:${modes})\\s*`),'').replace(/\s+/g,' ').trim();if(!route)return '';return route.replace(/^(.+?線)(.+)$/,(m,line,rest)=>`${line}：${rest.trim()}`)};
 const parts=[];let total=0;
 for(let i=0;i<lines.length;i++){
   let mode=lines[i],inline=splitInline(mode),inlineRest='';
   if(inline){mode=inline.mode;inlineRest=inline.rest}
   if(!isMode(mode))continue;
   if(/^(步行|走路)$/.test(mode)){
     let detail=timeInfo(inlineRest)?inlineRest:'';
     if(!detail)for(let j=i+1;j<Math.min(lines.length,i+5);j++){if(isMode(lines[j])||splitInline(lines[j]))break;if(timeInfo(lines[j])){detail=lines[j];break}}
     const t=timeInfo(detail);if(t){total+=t.mins;const dist=distanceInfo(detail);parts.push(`走路${t.mins}分${dist?`(${dist})`:''}`)}
     continue;
   }
   if(/^(火車|電車|地鐵|捷運|巴士|公車)$/.test(mode)){
     let route='',detail='';
     if(inlineRest){const ti=timeInfo(inlineRest);if(ti){detail=inlineRest;route=inlineRest.replace(/(?:約\s*)?\d+\s*分.*$/,'').trim()}else route=inlineRest}
     for(let j=i+1;j<Math.min(lines.length,i+6)&&!detail;j++){
       if(isMode(lines[j])||splitInline(lines[j]))break;
       if(!route&&!timeInfo(lines[j])&&!isAddress(lines[j])){route=lines[j];continue}
       if(timeInfo(lines[j])){detail=lines[j];break}
     }
     const t=timeInfo(detail);if(!t)continue;total+=t.mins;
     const nearby=[detail,...lines.slice(i+1,Math.min(lines.length,i+7))].join(' ');
     const nearbyStops=normalizeTransitNums(nearby).match(/[（(]\s*(\d+)\s*站\s*[)）]/);
     if(t.stops==null&&nearbyStops)t.stops=Number(nearbyStops[1]);
     const platform=platformInfo(nearby),pretty=formatRoute(route);
     let text=`搭乘${pretty||mode}${t.mins}分${t.stops!=null?`(${t.stops}站)`:''}`;
     if(platform)text+=`・${platform}號月台`;
     parts.push(text);continue;
   }
 }
 if(!parts.length){
   for(const line of lines){
     const walk=line.match(/(?:步行|走路).*?(\d+)\s*分(?:鐘)?[^\d]*(\d+(?:[.,]\d+)?)?\s*(公尺|米|m|公里|km)?/i);
     if(walk){const mins=Number(walk[1]);total+=mins;const dist=walk[2]?(/公里|km/i.test(walk[3]||'')?`${walk[2]}公里`:`${walk[2]}公尺`):'';parts.push(`走路${mins}分${dist?`(${dist})`:''}`);continue}
     const t=timeInfo(line);if(!t)continue;let route=line.replace(new RegExp(`^(?:${modes})\\s*`),'').replace(/(?:約\s*)?\d+\s*分.*$/,'').trim();if(!route)continue;total+=t.mins;const platform=platformInfo(line);route=formatRoute(route);let text=`搭乘${route}${t.mins}分${t.stops!=null?`(${t.stops}站)`:''}`;if(platform)text+=`・${platform}號月台`;parts.push(text)
   }
 }
 return parts.join('，');
}
function organizeTransport(id){const el=document.querySelector(`[data-table-row="${id}"][data-table-key="transport"]`);if(!el)return;const result=summarizeGoogleTransit(el.value);if(!result){toast('無法辨識 Google Maps 交通內容，請確認已貼上路線文字');return}el.value=result;saveTableCell(el);el.style.height='auto';el.style.height=Math.min(220,Math.max(58,el.scrollHeight+2))+'px';toast('已整理交通資訊')}
function previewBudget(){if(tab!=='trip')return;const budget=document.querySelector('[data-table-budget]');if(budget)budget.textContent='今日 '+budgetText([state.days[dayIndex]],budgetMode,true)+' · 全程 '+budgetText(state.days,budgetMode,true)}
function tableInput(r,key,label,type='text',extra=''){return `<label class="table-field"><span>${label}</span><input data-table-row="${r.id}" data-table-key="${key}" type="${type}" value="${esc(r[key])}" aria-label="${esc(r.name)}：${label}" ${extra}></label>`}
function tableArea(r,key,label){return `<label class="table-field"><span>${label}</span><textarea class="table-text" rows="2" data-table-row="${r.id}" data-table-key="${key}" aria-label="${esc(r.name)}：${label}">${esc(r[key])}</textarea></label>`}
function tableSelect(r,key,label,values){return `<label class="table-field"><span>${label}</span><select data-table-row="${r.id}" data-table-key="${key}" aria-label="${esc(r.name)}：${label}">${values.map(([value,text])=>`<option value="${value}" ${r[key]===value?'selected':''}>${esc(text)}</option>`).join('')}</select></label>`}
function rowLinks(r){return Array.isArray(r.links)?r.links:[]}
function rowLinkButtons(r,labelClass=''){return rowLinks(r).map(x=>outLink(x.url,esc(x.name||'連結'),labelClass)).join('')}
function editRowLink(rowId,linkId=''){const {r}=getRow(rowId),x=rowLinks(r).find(v=>v.id===linkId)||{id:'',name:'',url:''};modal(`${modalHeader(x.id?'編輯網址':'新增網址')}<form id="rowLinkForm" data-row="${esc(rowId)}" data-link="${esc(x.id)}">${field('網址名稱','name="name"',x.name,'text','required placeholder="例如：HARUKA 時刻表"')}${field('網址','name="url"',x.url,'url','required placeholder="https://…"')}<div class="modalactions">${x.id?`<button type="button" class="danger" data-action="delete-row-link" data-id="${esc(rowId)}" data-link="${esc(x.id)}">刪除此網址</button>`:''}<button type="button" data-action="close">取消</button><button class="primary">儲存</button></div></form>`)}
function tableLinkManager(r){return `<div class="table-field"><span>相關網址</span><div class="table-links">${rowLinks(r).map(x=>`<button type="button" data-action="edit-row-link" data-id="${r.id}" data-link="${esc(x.id)}">${esc(x.name||'未命名網址')}</button>`).join('')}<button type="button" data-action="edit-row-link" data-id="${r.id}">＋ 新增網址</button></div></div>`}
function tableRouteLinks(r){const p=routePoints(r.id);return `${outLink(rowMapUrl(r),'地圖')}${p.origin&&p.destination?outLink(routeUrl(r.id),'往下一行程路線'):''}${rowLinkButtons(r)}${p.destination?`<small class="muted">${esc(p.origin)} → ${esc(p.destination)}</small>`:''}`}
function itineraryTable(){const d=state.days[dayIndex],tt=times(d);return `<div class="page-title"><div><h2>行程編輯</h2><p class="muted">${esc(state.days[0].date)} — ${esc(state.days.at(-1).date)} · ${state.people} 人</p></div><div class="toolbar"><button data-action="undo" ${undoState?'':'disabled'}>復原</button><button data-tab="schedule">時刻表</button></div></div>${dayPicker()}${labelChoices()}<p class="muted">直接修改，離開欄位即儲存。時間自動重算，費用可逐筆選擇台幣或日圓；預算依幣別分別加總。其他資料與操作可展開「其他設定」。</p><details class="table-day-settings"><summary>當日設定 · ${esc(d.title)}</summary><div class="table-day-fields">${field('當日標題','data-table-day="title"',d.title)}${field('每日出發時間','data-table-day="start"',d.start,'time','required')}${field('第一段路線起點','data-table-day="base"',d.base)}</div></details><div class="budget"><select data-budget aria-label="預算顯示"><option value="1" ${budgetMode===1?'selected':''}>每人</option><option value="${state.people}" ${budgetMode===state.people&&budgetMode!==1?'selected':''}>${state.people}人合計</option></select><p class="table-budget muted" data-table-budget>今日 ${budgetText([d],budgetMode)} · 全程 ${budgetText(state.days,budgetMode)}</p></div><div class="itinerary-table-wrap"><table class="itinerary-table"><caption class="sr-only">${esc(d.date)} ${esc(d.title)}行程資料</caption><thead><tr><th scope="col">抵達</th><th scope="col">行程</th><th scope="col">交通</th><th scope="col">交通／停留</th><th scope="col">費用</th></tr></thead>${d.rows.map((r,i)=>`<tbody data-table-id="${r.id}"><tr class="table-primary"><td class="table-time"><small data-table-start-label>${pureTransport(r)?'出發':'抵達'}</small><strong data-table-arrival>${fmt(pureTransport(r)?tt[i].start:tt[i].arrival)}</strong><small data-table-end-label>${pureTransport(r)?'抵達':'離開'}</small><span data-table-end>${fmt(tt[i].end)}</span></td><td class="table-name-cell"><span class="badge ${esc(r.category)}" data-table-badge>${esc(labelName(r.category))}</span>${tableInput(r,'name','行程名稱','text','required')}</td><td class="table-transport-cell">${tableArea(r,'transport','到此地交通方式／路線')}<button type="button" data-action="organize-transport" data-id="${r.id}">整理 Google Maps</button></td><td class="table-duration-cell"><div class="table-duration-inputs">${tableInput(r,'travelMinutes','到此地交通（分）','number','min="0" max="1440" step="1" required')}${tableInput(r,'stayMinutes','此地停留（分）','number','min="0" max="1440" step="1" required')}</div><small class="muted" data-table-total>合計 ${r.duration} 分鐘</small></td><td class="table-cost-cell">${tableSelect({...r,costCurrency:rowCurrency(r)},'costCurrency','費用幣別',[['JPY','日圓（JPY）'],['TWD','台幣（TWD）']])}${tableInput(r,'cost','費用','number','min="0" max="10000000" step="any" required')}${tableSelect(r,'costBasis','費用基準',[['person','每人'],['group','全員']])}<small data-table-cost-basis>${r.costBasis==='group'?`全員 ÷ ${state.people} 人 ≈ 每人 ${money(Math.round(r.cost/state.people),rowCurrency(r))}`:'每人'}</small></td></tr><tr class="table-secondary"><td colspan="5"><div class="table-quick-actions"><button data-action="table-shift" data-dir="-1" data-id="${r.id}" ${i===0?'disabled':''}>↑</button><button data-action="table-shift" data-dir="1" data-id="${r.id}" ${i===d.rows.length-1?'disabled':''}>↓</button><div class="table-links">${tableRouteLinks(r)}</div></div><details class="table-extra"><summary>備註／其他設定</summary><div class="table-extra-fields">${tableArea(r,'note','備註／說明')}${tableSelect(r,'category','行程標籤',types.map(t=>[t,labelName(t)]))}${tableInput(r,'place','Google Maps 地點')}${tableArea(r,'costNote','費用說明')}${tableSelect(r,'mode','導航交通方式',[['transit','大眾運輸'],['walking','步行'],['driving','開車／計程車']])}${tableInput(r,'mapLink','地圖網址（留白自動搜尋）','url')}${tableLinkManager(r)}</div><div class="table-related">${relatedLinks(r,true)}</div><div class="table-row-actions"><button data-action="table-duplicate" data-id="${r.id}">複製本列</button><label class="table-field"><span>移動／複製到</span><select data-table-target aria-label="${esc(r.name)}移動或複製目標日期">${state.days.map((x,j)=>`<option value="${j}" ${x===d?'selected':''}>D${j+1} · ${esc(x.date.slice(5))}</option>`).join('')}</select></label><button data-action="table-transfer" data-id="${r.id}" data-copy="false">移動</button><button data-action="table-transfer" data-id="${r.id}" data-copy="true">複製到該日</button><button data-action="delete-row" class="danger" data-id="${r.id}">刪除</button></div></details></td></tr></tbody>`).join('')}</table></div>${!d.rows.length?'<p class="empty">尚無行程，新增一列開始編輯。</p>':''}<button data-action="table-add" class="primary full">＋ 新增一列行程</button>`}
function refreshTableComputed(){if(tab!=='trip')return;const d=state.days[dayIndex],tt=times(d);d.rows.forEach((r,i)=>{const row=document.querySelector(`[data-table-id="${r.id}"]`);if(!row)return;row.querySelector('[data-table-start-label]').textContent=pureTransport(r)?'出發':'抵達';row.querySelector('[data-table-end-label]').textContent=pureTransport(r)?'抵達':'離開';row.querySelector('[data-table-arrival]').textContent=fmt(pureTransport(r)?tt[i].start:tt[i].arrival);row.querySelector('[data-table-end]').textContent=fmt(tt[i].end);row.querySelector('[data-table-total]').textContent='合計 '+r.duration+' 分鐘';const badge=row.querySelector('[data-table-badge]');badge.className='badge '+r.category;badge.textContent=labelName(r.category);const currency=row.querySelector('[data-table-key="costCurrency"]');if(currency)currency.value=rowCurrency(r);const basis=row.querySelector('[data-table-cost-basis]');if(basis)basis.textContent=r.costBasis==='group'?`全員 ÷ ${state.people} 人 ≈ 每人 ${money(Math.round(r.cost/state.people),rowCurrency(r))}`:'每人';row.querySelector('.table-links').innerHTML=tableRouteLinks(r);row.querySelector('.table-related').innerHTML=relatedLinks(r,true)});const budget=document.querySelector('[data-table-budget]');if(budget)budget.textContent='今日 '+budgetText([d],budgetMode)+' · 全程 '+budgetText(state.days,budgetMode);document.querySelectorAll('[data-action="undo"]').forEach(b=>b.disabled=!undoState)}
function saveTableCell(el){const key=el.dataset.tableKey,allowed=['name','place','transport','category','travelMinutes','stayMinutes','cost','costCurrency','costBasis','costNote','note','mode','mapLink','url','origin','destination'];if(!allowed.includes(key))return;const {r,d,i}=getRow(el.dataset.tableRow),original=r[key];try{let value=el.value;if(['travelMinutes','stayMinutes','cost'].includes(key)){if(value.trim()==='')throw Error('時間與費用不可留白，沒有請填 0');value=Number(value)}if(key==='costCurrency'&&!['JPY','TWD'].includes(value))throw Error('請選擇台幣或日圓');if(key==='category'){value=value.trim();if(!types.includes(value))throw Error('請選擇既有標籤')}if(key==='name'){value=value.trim();if(!value)throw Error('請填入行程名稱')}if(['url','mapLink'].includes(key)&&value&&!safeUrl(value))throw Error('請填有效的 http 或 https 網址');const proposed=structuredClone(state),row=proposed.days[state.days.indexOf(d)].rows[i];row[key]=value;row.duration=row.travelMinutes+row.stayMinutes;validTrip(proposed);if(original===value){el.removeAttribute('aria-invalid');return}snapshot();r[key]=value;r.duration=r.travelMinutes+r.stayMinutes;save();el.value=String(value);el.removeAttribute('aria-invalid');refreshTableComputed()}catch(e){el.value=String(original);el.setAttribute('aria-invalid','true');toast(e.message)}}
function saveTableDay(el){const key=el.dataset.tableDay;if(!['start','title','base'].includes(key))return;const d=state.days[dayIndex],old=d[key];try{const proposed=structuredClone(state);proposed.days[dayIndex][key]=el.value;validTrip(proposed);if(old===el.value)return;snapshot();d[key]=el.value;save();refreshTableComputed()}catch(e){el.value=old;toast(e.message)}}
function tableCommit(){const wrap=document.querySelector('.itinerary-table-wrap'),left=wrap?.scrollLeft||0;commit();const next=document.querySelector('.itinerary-table-wrap');if(next)next.scrollLeft=left}
function trip(){return itineraryTable()}
function relatedArticles(r){return state.info.filter(x=>!x.parentKey&&((Array.isArray(x.rowIds)&&x.rowIds.includes(r.id))||x.rowId===r.id))}
function relatedLinks(r,editable=false){const a=relatedArticles(r);return `<div class="related-links">${state.refs.filter(x=>x.rowId===r.id).map(x=>outLink(x.url,esc(x.title))).join('')}${a.map(x=>editable?`<div class="info-actions"><button data-action="article" data-id="${x.id}">▧ ${esc(x.name)}</button><button type="button" class="danger" data-action="unlink-info" data-id="${r.id}" data-info-id="${x.id}">解除連動</button></div>`:`<button data-action="article" data-id="${x.id}">▧ ${esc(x.name)}</button>`).join('')}</div>`}
function schedule(){return `<div class="page-title"><div><h2>時刻表</h2><p class="muted">畫面僅顯示單日；需要全程時可輸出成一頁 PDF。</p></div><button class="primary" data-action="schedule-pdf">全程時刻表 PDF</button></div><div class="legend">${types.map(x=>`<span class="badge ${x}">${x}</span>`).join('')}</div>${dayPicker()}${scheduleCanvas([dayIndex])}`}
function printFullSchedule(){const rows=state.days.map((d,j)=>{const tt=times(d);return `<section><h2>D${j+1} · ${esc(d.date)} · ${esc(d.title)}</h2><table><thead><tr><th>時間</th><th>行程</th><th>交通／停留</th></tr></thead><tbody>${d.rows.map((r,i)=>`<tr class="cat-${esc(labelName(r.category))}"><td>${fmt(tt[i].arrival)}–${fmt(tt[i].end)}</td><td><span class="cat-label">${esc(labelName(r.category))}</span>${esc(r.name)}</td><td>交通 ${r.travelMinutes}分 · 停留 ${r.stayMinutes}分</td></tr>`).join('')||'<tr><td colspan="3">尚無行程</td></tr>'}</tbody></table></section>`}).join('');const w=window.open('','_blank');if(!w){toast('瀏覽器阻擋了 PDF 視窗，請允許彈出視窗後再試');return}w.document.write(`<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><title>${esc(state.name)}－全程時刻表</title><style>@page{size:A4 landscape;margin:7mm}*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",sans-serif;color:#24324a;margin:0;font-size:${state.days.length>8?'7':'8'}pt}h1{font-size:14pt;margin:0 0 5mm}main{display:grid;grid-template-columns:repeat(${Math.min(4,Math.max(1,state.days.length))},1fr);gap:3mm}section{break-inside:avoid;border:1px solid #ccd3db;border-radius:5px;padding:2.5mm}h2{font-size:9pt;margin:0 0 1.5mm}table{width:100%;border-collapse:collapse}th,td{padding:1mm;border-bottom:1px solid #e3e6ea;text-align:left;vertical-align:top}th{font-size:7pt;background:#24324a;color:#fff}td{font-size:7pt}section,th,td,tr,.cat-label{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}.cat-label{display:inline-block;padding:.4mm 1mm;border-radius:2mm;margin-right:1mm;font-size:6pt;font-weight:700;background:#e8f4ef;color:#2a5446}.cat-交通 td{background:#e5eefc}.cat-交通 .cat-label{background:#cbdcf5;color:#36547e}.cat-餐飲 td{background:#fff1df}.cat-餐飲 .cat-label{background:#f8dfbd;color:#7e5424}.cat-住宿 td{background:#edeafa}.cat-住宿 .cat-label{background:#dcd6f4;color:#625080}.cat-逛街 td{background:#fde9ef}.cat-逛街 .cat-label{background:#f5cfdb;color:#8b4563}.cat-其他 td{background:#edf0f3}.cat-其他 .cat-label{background:#dce1e6;color:#536171}@media print{*{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}button{display:none}}</style></head><body><h1>${esc(state.name)}｜全程時刻表</h1><main>${rows}</main><script>window.onload=()=>setTimeout(()=>window.print(),250);<\/script></body></html>`);w.document.close()}
function scheduleZeroNotes(indices){return indices.map(j=>{const d=state.days[j],tt=times(d),rows=d.rows.map((r,i)=>r.duration===0?`<button data-action="detail" data-id="${r.id}" class="zero-event ${esc(labelName(r.category))}"><small>${fmt(tt[i].start)} · 0 分鐘</small><span>${esc(r.name)}</span></button>`:'').join('');return rows?`<section class="card zero-events"><h3>D${j+1} · ${esc(d.date)} · 0 分鐘行程</h3><p class="muted">不占用時間，後續行程接續同一時刻。</p>${rows}</section>`:''}).join('')}
function scheduleCanvas(indices){const all=indices.flatMap(j=>times(state.days[j])),start=all.length?Math.floor(Math.min(...all.map(t=>t.start))/60)*60:480,end=all.length?Math.ceil(Math.max(...all.map(t=>t.end))/60)*60:1200,scale=0.8;return `${scheduleZeroNotes(indices)}<div class="schedule-wrap ${indices.length===1?'single':''}"><div class="schedule-grid" data-axis-start="${start}" data-axis-end="${end}" style="--columns:${indices.length};--hour-height:${60*scale}px"><div class="schedule-corner">時間</div>${indices.map(j=>`<div class="schedule-heading">D${j+1} · ${state.days[j].date.slice(5)}</div>`).join('')}<div class="time-axis" style="height:${(end-start)*scale}px">${Array.from({length:Math.max(1,(end-start)/60+1)},(_,i)=>`<span data-minute="${start+i*60}" style="top:${i*60*scale}px">${fmt(start+i*60)}</span>`).join('')}</div>${indices.map(j=>{const d=state.days[j],tt=times(d);return `<div class="schedule-column" style="height:${(end-start)*scale}px">${d.rows.map((r,i)=>r.duration===0?'':`<button class="event-label ${esc(r.category)}" data-action="detail" data-id="${r.id}" data-start="${tt[i].start}" data-duration="${r.duration}" style="top:${(tt[i].start-start)*scale}px;height:${r.duration*scale}px" aria-label="${esc(r.name)}，${r.duration}分鐘"><small>${fmt(tt[i].start)}–${fmt(tt[i].end)}</small><span>${esc(r.name)}</span><small>交通 ${r.travelMinutes} 分 · 停留 ${r.stayMinutes} 分</small></button>`).join('')}</div>`}).join('')}</div></div>`}
function scheduleCoordinates(start,end,events){const bounds=[...new Set([start,end,...events.flatMap(e=>[e.start,e.start+e.duration])])].sort((a,b)=>a-b),heights=bounds.slice(1).map((v,i)=>(v-bounds[i])*.8);for(const e of events){const first=bounds.indexOf(e.start),last=bounds.indexOf(e.start+e.duration);if(last<=first)continue;const current=heights.slice(first,last).reduce((a,b)=>a+b,0),extra=Math.max(0,e.height+4-current);for(let i=first;i<last;i++)heights[i]+=extra*(bounds[i+1]-bounds[i])/e.duration}const positions=[0];heights.forEach(h=>positions.push(positions.at(-1)+h));return minute=>{if(minute<=start)return 0;if(minute>=end)return positions.at(-1);const i=bounds.findIndex(v=>v>minute)-1;return positions[i]+(minute-bounds[i])/(bounds[i+1]-bounds[i])*heights[i]}}
function layoutSchedules(){document.querySelectorAll('.schedule-grid').forEach(grid=>{const labels=[...grid.querySelectorAll('.event-label')].filter(label=>Number(label.dataset.duration)>0),start=Number(grid.dataset.axisStart),end=Number(grid.dataset.axisEnd),events=labels.map(label=>{label.style.height='auto';return {start:Number(label.dataset.start),duration:Number(label.dataset.duration),height:Math.ceil(label.getBoundingClientRect().height)}}),coordinate=scheduleCoordinates(start,end,events);labels.forEach((label,i)=>{const e=events[i];label.style.top=coordinate(e.start)+'px';label.style.height=(coordinate(e.start+e.duration)-coordinate(e.start))+'px'});grid.querySelectorAll('.schedule-column,.time-axis').forEach(col=>col.style.height=coordinate(end)+'px');grid.querySelectorAll('.time-axis span').forEach(tick=>tick.style.top=coordinate(Number(tick.dataset.minute))+'px')})}
function hotelContent(v){const fields=[['地址',v.address],['電話',v.phone],['入住時間',v.checkIn],['退房時間',v.checkOut],['金額',v.amount!==''&&v.amount!=null?money(Number(v.amount)): ''],['預約號碼',v.reservation],['PIN 碼',v.pin],['訂房平台',v.bookingPlatform]];return `<dl class="hotel-details">${fields.map(([label,value])=>`<div><dt>${label}</dt><dd>${esc(value||'待填')}</dd></div>`).join('')}</dl><h4>備註</h4><p class="prewrap">${esc(v.note)}</p>${v.bookingUrl?outLink(v.bookingUrl,'🔍 '+esc(v.bookingPlatform||'訂房平台')+' 訂單'):''}`}
function hotelDefaults(v){for(const k of ['address','phone','checkIn','checkOut','amount','reservation','pin','bookingPlatform','bookingUrl'])v[k]??='';if(!v.hotelFieldsMigrated){v.address||=(v.note.match(/地址[：:]([^\n]+)/)?.[1]||'').trim();v.checkIn||=v.note.match(/入住\s*(\d{1,2}:\d{2})/)?.[1]||'';v.checkOut||=v.note.match(/退房\s*(\d{1,2}:\d{2})/)?.[1]||'';v.hotelFieldsMigrated=true}return v}
function transportEstimate(text){const groups=[...String(text).matchAll(/(\d+)\s*(?:[–—~～-]\s*(\d+)\s*)?分/g)];return groups.reduce((n,m)=>n+Number(m[2]||m[1]),0)}
function splitRowTime(r){if(r.travelMinutes==null&&r.stayMinutes==null){const total=r.duration;let travel=r.category==='交通'?total:Math.min(total,transportEstimate(r.transport));r.travelMinutes=travel;r.stayMinutes=total-travel}if(r.travelMinutes==null)r.travelMinutes=0;if(r.stayMinutes==null)r.stayMinutes=0;r.duration=r.travelMinutes+r.stayMinutes;if(!r.transportMethodFilled){const description=String(r.transport||'').trim(),method=r.name.match(/(?:JR(?:湖西線|嵯峨野線)?|京都巴士\d+號|Haruka\s*\d*號?)/)?.[0];if(method&&!/JR|巴士|Haruka/i.test(description))r.transport=method+' · '+description;if(!description||/^[–—-]$/.test(description))r.transport=r.travelMinutes===0?'無交通移動':'交通方式待填';r.transportMethodFilled=true}r.mapLink??='';r.gap=0;return r}
function upgradeTrip(t){t.food||=[];t.entryRowIds=Array.isArray(t.entryRowIds)?t.entryRowIds:[];t.days.forEach(d=>d.rows.forEach(r=>{splitRowTime(r);r.links=Array.isArray(r.links)?r.links.filter(x=>x&&typeof x.name==='string'&&typeof x.url==='string'):[];if(r.url&&!r.links.some(x=>x.url===r.url))r.links.push({id:uid(),name:'資料來源',url:r.url});}));t.flights.forEach(f=>{delete f.terminal;delete f.arrivalTerminal;f.rowIds=Array.isArray(f.rowIds)?f.rowIds:[]});t.info.forEach(v=>{v.type=({'飯店':'住宿','餐廳':'餐飲','購物':'逛街'})[v.type]||v.type;if(![...baseTypes,...(t.labels||[])].includes(v.type)&&!t.info.some(x=>x.type===v.type))v.type='其他';if(v.type==='住宿')hotelDefaults(v);if(v.type==='逛街'&&!v.parentKey)v.sourceKey||='area-'+v.id});return t}
function formattedNote(text){let src=String(text),tokens=[],stash=(html)=>{const k=`@@FMT${tokens.length}@@`;tokens.push(html);return k};src=src.replace(/\*\*([^*\n]+)\*\*/g,(_,x)=>stash(`<strong>${esc(x)}</strong>`)).replace(/\[\[(紅|藍|橘):([^\]\n]+)\]\]/g,(_,c,x)=>stash(`<strong class="note-${c==='紅'?'red':c==='藍'?'blue':'orange'}">${esc(x)}</strong>`));const pattern=/(禁止[^：:\n]*|不得[^，。；\n]*|務必[^，。；\n]*|單瓶不得超過一百毫升|一公升|100\s*ml|100\s*毫升|20×20公分|7\s*KG|23\s*KG|158公分|203公分|行動電源|鋰電池|手提行李|託運行李|托運行李)/gi;let out='',last=0;for(const m of src.matchAll(pattern)){out+=esc(src.slice(last,m.index));out+=`<strong class="${/禁止|不得|務必/.test(m[0])?'note-danger':'note-key'}">${esc(m[0])}</strong>`;last=m.index+m[0].length}out+=esc(src.slice(last));tokens.forEach((html,i)=>out=out.replace(`@@FMT${i}@@`,html));return out}
function richEditor(label,name,value,cls='large-note'){return `<div class="format-toolbar"><button type="button" data-action="format-rich" data-target="${name}" data-format="bold"><strong>B 粗體</strong></button><button type="button" data-action="format-rich" data-target="${name}" data-format="red" class="note-red">紅色</button><button type="button" data-action="format-rich" data-target="${name}" data-format="blue" class="note-blue">藍色</button><button type="button" data-action="format-rich" data-target="${name}" data-format="orange" class="note-orange">橘色</button></div>${area(label,`name="${name}"`,value,cls)}<p class="muted">可選取文字後套用粗體或顏色。</p>`}
function richNoteEditor(){return richEditor('行李攜帶注意事項','luggageNote',state.luggageNote)}
function editLuggageNote(){modal(`${modalHeader('編輯行李攜帶注意事項')}<form id="luggageNoteForm">${richNoteEditor()}${relationPicker('luggageNoteRowIds',state.luggageNoteRowIds||[])}<div class="modalactions"><button type="button" data-action="close">取消</button><button class="primary">儲存</button></div></form>`) }
function packingRules(){const airline=state.flights.some(f=>/國泰|Cathay/i.test(f.airline));return airline?`<div class="verified-packing"><h4>國泰航空攜帶重點</h4><ul><li><strong class="note-danger">行動電源不可託運，也不可放在頭頂行李櫃。</strong>應放在前方座位下的隨身行李。</li><li><strong class="note-key">每人最多 2 個行動電源。</strong>機上不可使用行動電源，也不可替行動電源充電。</li><li>液體、膠狀與噴霧用品一般以<strong class="note-key">每個容器不超過 100 ml</strong>，放入<strong class="note-key">每人一個、容量不超過 1 L 的透明可重複密封袋</strong>。</li></ul><p class="muted">2026/10/03 核對國泰官網；特殊液體與容量等細則請開啟官方規定。重量與件數以你的機票額度為準。</p><div class="info-actions">${outLink('https://www.cathaypacific.com/cx/en_TW/baggage/controlled-and-banned-items/lithium-batteries.html','🔍 行動電源規定')}${outLink('https://www.cathaypacific.com/cx/en_TW/baggage/controlled-and-banned-items/controlled-items.html','🔍 受管制物品')}</div></div>`:''}
function infoExtra(v){return ['景點','餐飲'].includes(v.type)?`<dl class="hotel-details">${v.openingHours?`<div><dt>營業時間</dt><dd>${esc(v.openingHours)}</dd></div>`:''}${v.fee?`<div><dt>費用</dt><dd>${esc(v.fee)}</dd></div>`:''}</dl>`:''}
function infoContent(v){return `${infoExtra(v)}${v.type==='住宿'?hotelContent(v).replace(esc(v.note),formattedNote(v.note)):`<p class="prewrap">${formattedNote(v.note)}</p>`}${state.info.filter(x=>v.sourceKey&&x.parentKey===v.sourceKey).map(x=>`<details class="shop-card"><summary><strong>${esc(x.name)}</strong></summary><p class="prewrap">${formattedNote(x.note)}</p><div class="info-actions">${x.place?outLink(mapUrl(x.place),'🔍 地圖'):''}${x.url?outLink(x.url,'🔍 來源'):''}<button data-action="edit-info" data-index="${state.info.indexOf(x)}">編輯店家</button><button data-action="delete-info" data-index="${state.info.indexOf(x)}" class="danger">刪除</button></div></details>`).join('')}${v.type==='逛街'&&!v.parentKey?`<button data-action="add-shop" data-parent-key="${esc(v.sourceKey)}" class="add-shop">＋ 新增店家</button>`:''}`}
function infoRelationText(v){const ids=Array.isArray(v.rowIds)?v.rowIds:(v.rowId?[v.rowId]:[]),names=ids.map(id=>state.days.flatMap((d,j)=>d.rows.map(r=>({id:r.id,name:`D${j+1} · ${r.name}`}))).find(x=>x.id===id)?.name).filter(Boolean);return names.length?`<p class="info-related">關聯行程：${names.map(esc).join('、')}</p>`:''}
function relationPicker(name,selected=[]){return `<fieldset class="related-picker"><legend>關聯行程（可複選）</legend><p class="muted">勾選後，這筆資料會顯示在旅遊手冊的對應行程下方。</p>${state.days.map((d,j)=>`<div class="related-day">D${j+1} · ${esc(d.date)} · ${esc(d.title)}</div>${d.rows.map(r=>`<label class="related-choice"><input type="checkbox" name="${name}" value="${r.id}" ${selected.includes(r.id)?'checked':''}><span>${esc(r.name)}</span></label>`).join('')}`).join('')}</fieldset>`}
function relationNames(ids=[]){const rows=state.days.flatMap((d,j)=>d.rows.map(r=>({id:r.id,name:`D${j+1} · ${r.name}`})));const names=ids.map(id=>rows.find(x=>x.id===id)?.name).filter(Boolean);return names.length?`<p class="info-related">關聯行程：${names.map(esc).join('、')}</p>`:'<p class="muted">尚未關聯行程</p>'}
function handbookInfoContent(v){const hotel=`${infoExtra(v)}${v.type==='住宿'?hotelContent(v).replace(esc(v.note),formattedNote(v.note)):`<p class="prewrap">${formattedNote(v.note)}</p>`}`;const children=state.info.filter(x=>v.sourceKey&&x.parentKey===v.sourceKey).map(x=>`<details class="shop-card"><summary><strong>${esc(x.name)}</strong></summary><p class="prewrap">${formattedNote(x.note)}</p><div class="info-actions">${x.place?outLink(mapUrl(x.place),'🔍 地圖'):''}${x.url?outLink(x.url,'🔍 來源／官網'):''}</div></details>`).join('');return `${hotel}${children}<div class="info-actions">${v.place?outLink(mapUrl(v.place),'🔍 地圖'):''}${v.url?outLink(v.url,'🔍 來源／官網'):''}</div>`}
function info(){const shown=state.info.map((v,i)=>({v,i})).filter(({v})=>!v.parentKey&&(!infoType.length||infoType.includes(v.type)));const showTransport=!infoType.length||infoType.includes('交通'),showOther=!infoType.length||infoType.includes('其他');return `${infoReturn?`<button class="info-return" data-action="return-book">← 返回原行程</button>`:''}<div class="page-title"><h2>資訊</h2><div class="toolbar"><button data-action="manage-labels">管理標籤</button><button data-action="add-info">＋ 新增</button></div></div><fieldset class="filter-checks"><legend>分類篩選（可複選）</legend><label class="filter-check"><input type="checkbox" data-info-all ${!infoType.length?'checked':''}>全部</label>${types.map(t=>`<label class="filter-check"><input type="checkbox" data-info-filter value="${esc(t)}" ${infoType.includes(t)?'checked':''}>${esc(labelName(t))}</label>`).join('')}</fieldset>${showTransport?`<details class="card info-card"><summary><span class="badge 交通">交通</span><h3>航班資訊</h3></summary>${state.flights.map((f,i)=>`<section class="flight-inline"><h4>${i?'回程':'去程'} · ${esc(f.date)} ${esc(f.airline)} ${esc(f.number)}</h4><p>${esc(f.from)} ${esc(f.depart||'待填')} → ${esc(f.to)} ${esc(f.arrive||'待填')}</p>${f.note?`<p class="prewrap">${formattedNote(f.note)}</p>`:''}<button data-action="edit-flight" data-index="${i}">編輯${i?'回程':'去程'}航班</button></section>`).join('')}</details>`:''}${showOther?`<details class="card info-card"><summary><span class="badge 其他">其他</span><h3>入境流程與提醒</h3></summary>${state.entryNote?`<p class="prewrap">${formattedNote(state.entryNote)}</p>`:'<p class="muted">尚未填寫入境提醒。</p>'}<div class="info-actions">${outLink('https://www.vjw.digital.go.jp/','🔍 Visit Japan Web')}<button data-action="edit-entry">編輯</button></div></details>`:''}${showOther?`<details class="card info-card"><summary><span class="badge 其他">其他</span><h3>行李攜帶注意事項</h3></summary>${packingRules()}${state.luggageNote?`<div class="prewrap luggage-rich">${formattedNote(state.luggageNote)}</div>`:'<p class="muted">尚未填寫行李攜帶注意事項。</p>'}${relationNames(state.luggageNoteRowIds||[])}<div class="info-actions"><button data-action="edit-luggage-note">編輯</button></div></details>`:''}${shown.map(({v,i})=>`<details class="card info-card" data-info-id="${v.id}" ${infoFocusId===v.id?'open':''}><summary><span class="badge ${esc(v.type)}">${esc(labelName(v.type))}${v.region?' · '+esc(v.region):''}</span><h3>${esc(v.name)}</h3></summary>${infoContent(v)}${infoRelationText(v)}<div class="info-actions">${v.place?outLink(mapUrl(v.place),'🔍 地圖'):''}${v.url?outLink(v.url,'🔍 來源／官網'):''}<button data-action="edit-info" data-index="${i}">編輯</button><button class="danger" data-action="delete-info" data-index="${i}">刪除</button></div></details>`).join('')}`}
function editEntry(){modal(`${modalHeader('編輯入境流程與提醒')}<form id="entryForm">${richEditor('入境流程與提醒','entryNote',state.entryNote)}<fieldset class="related-picker"><legend>顯示於哪些行程（可複選）</legend><p class="muted">只有勾選的行程，旅遊手冊才會顯示入境流程與提醒。</p>${state.days.map((d,j)=>`<div class="related-day">D${j+1} · ${esc(d.date)} · ${esc(d.title)}</div>${d.rows.map(r=>`<label class="related-choice"><input type="checkbox" name="entryRowIds" value="${r.id}" ${(state.entryRowIds||[]).includes(r.id)?'checked':''}><span>${esc(r.name)}</span></label>`).join('')}`).join('')}</fieldset><div class="modalactions"><button type="button" data-action="close">取消</button><button class="primary">儲存</button></div></form>`)}
function lists(){return `<div class="page-title"><h2>旅行清單</h2></div><div class="segmented"><button data-list-mode="luggage" class="${listMode==='luggage'?'selected':''}">行李準備</button><button data-list-mode="todo" class="${listMode==='todo'?'selected':''}">待辦事項</button></div>${checklist(listMode)}`}
function checkRow(v,i,kind){return `<div class="checkrow ${v.done?'checked':''}"><input type="checkbox" aria-label="完成${esc(v.text)}" data-check="${kind}" data-index="${i}" ${v.done?'checked':''}><span class="checktext">${esc(v.text)}</span><button data-action="edit-check" data-kind="${kind}" data-index="${i}" aria-label="編輯${esc(v.text)}">編輯</button><button data-action="delete-check" class="icon-danger" data-kind="${kind}" data-index="${i}" aria-label="刪除${esc(v.text)}">×</button></div>`}
function checklist(kind){const list=state[kind],done=list.filter(x=>x.done).length;return `<div class="progress-summary"><h3>${kind==='luggage'?'行李準備':'待辦事項'}</h3><span>${done}／${list.length} 完成</span><progress value="${done}" max="${list.length||1}"></progress></div>${kind==='luggage'?'<div class="toolbar"><button class="primary" data-action="luggage-pdf">行李準備 PDF</button></div>':''}${kind==='luggage'?state.luggageGroups.map((c,j)=>{const items=list.map((v,i)=>({v,i})).filter(x=>x.v.category===c);return `<details class="card category-card" open><summary><strong>${esc(c)}</strong><span>${items.filter(x=>x.v.done).length}／${items.length}</span></summary>${items.map(({v,i})=>checkRow(v,i,kind)).join('')}<div class="category-actions"><button data-action="add-check" data-kind="luggage" data-category="${esc(c)}">＋ 新增項目</button><button data-action="edit-category" data-index="${j}">調整分類</button></div></details>`}).join(''):`<section class="card">${list.map((v,i)=>checkRow(v,i,kind)).join('')}<button data-action="add-check" data-kind="todo">＋ 新增待辦</button></section>`}${kind==='luggage'?`<div class="toolbar"><button data-action="add-category">＋ 新增分類</button><button data-action="save-template">存為共用行李範本</button></div><p class="muted">PDF 會依目前行李分類與項目重新產生，所有方塊一律為未勾選，方便列印後重新確認。</p>`:''}`}
function printLuggagePdf(){const groups=state.luggageGroups.map(c=>({name:c,items:state.luggage.filter(x=>x.category===c)})).filter(g=>g.items.length);const cols=[[],[],[]],heights=[0,0,0];groups.forEach(g=>{const weight=2.2+g.items.length;const i=heights.indexOf(Math.min(...heights));cols[i].push(g);heights[i]+=weight});const body=cols.map(col=>`<div class="pdf-col">${col.map(g=>`<section><h2>${esc(g.name)}</h2>${g.items.map(x=>`<div class="pdf-item"><span class="box">□</span><span>${esc(x.text)}</span></div>`).join('')}</section>`).join('')}</div>`).join('');const w=window.open('','_blank');if(!w){toast('瀏覽器阻擋了 PDF 視窗，請允許彈出視窗後再試');return}w.document.write(`<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><title>${esc(state.name)}－行李準備</title><style>@page{size:A4 portrait;margin:10mm}*{box-sizing:border-box}html,body{margin:0;padding:0;color:#24324a;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",sans-serif}body{font-size:12pt}h1{font-size:20pt;margin:0 0 6mm;text-align:center;letter-spacing:.5px}.pdf-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6mm}.pdf-col{min-width:0}section{break-inside:avoid;margin:0 0 5mm}h2{font-size:16pt;line-height:1.25;margin:0 0 2.2mm;padding:1.7mm 2.2mm;background:#eef1f4;border-radius:2mm}.pdf-item{display:grid;grid-template-columns:5mm minmax(0,1fr);gap:1.4mm;align-items:start;font-size:12pt;line-height:1.35;margin:1.4mm 0}.box{font-family:Arial,sans-serif;font-size:14pt;line-height:1.05}@media print{h2{-webkit-print-color-adjust:exact;print-color-adjust:exact}}</style></head><body><h1>行李準備</h1><main class="pdf-grid">${body}</main><script>window.onload=()=>setTimeout(()=>window.print(),250)<\/script></body></html>`);w.document.close()} 
function more(){return `<h2>更多</h2><div class="menu-grid">${[['trip','行程編輯','新增、調整與編輯每日行程'],['github','GitHub 同步','共用資料與手機編輯授權'],['journeys','我的旅程','新增、複製與切換旅行'],['refs','收藏網址','連結與個人筆記'],['backup','備份與轉移','目前旅程或全部旅程']].map(([t,n,s])=>`<button data-tab="${t}" class="menu-card"><strong>${n}</strong><small>${s}</small></button>`).join('')}</div>`}
function flightFields(){return [['航空公司','airline'],['航班號碼','number'],['日期','date','date'],['出發機場','from'],['抵達機場','to'],['起飛時間','depart','time'],['抵達時間','arrive','time'],['訂位代號','booking']]}
function editFlight(i){const f=state.flights[i];if(!f)return;modal(`${modalHeader(i?'編輯回程航班':'編輯去程航班')}<form id="flightForm" data-index="${i}"><div class="fields">${flightFields().map(([l,k,t])=>field(l,`name="${k}"`,f[k],t||'text')).join('')}</div>${richEditor('航班注意事項','note',f.note,'flight-note')}<fieldset class="related-picker"><legend>顯示於哪些行程（可複選）</legend><p class="muted">只有勾選的行程，旅遊手冊才會顯示這段航班資訊。</p>${state.days.map((d,j)=>`<div class="related-day">D${j+1} · ${esc(d.date)} · ${esc(d.title)}</div>${d.rows.map(r=>`<label class="related-choice"><input type="checkbox" name="rowIds" value="${r.id}" ${(f.rowIds||[]).includes(r.id)?'checked':''}><span>${esc(r.name)}</span></label>`).join('')}`).join('')}</fieldset><div class="modalactions"><button type="button" data-action="close">取消</button><button class="primary">儲存</button></div></form>`)}
function flights(){return `<div class="page-title"><h2>航班資訊</h2><button data-tab="more">回到更多</button></div><p class="muted">時間依當地時間填寫；可為每一段航班勾選要顯示的關聯行程。</p>${state.flights.map((f,i)=>`<details class="card flight-card"><summary><strong>${i?'回程':'去程'}</strong><span class="muted">${esc(f.date)} · ${esc(f.number||f.airline||'航班待填')}</span></summary><dl class="hotel-details">${flightFields().map(([l,k])=>`<div><dt>${l}</dt><dd>${esc(f[k]||'待填')}</dd></div>`).join('')}</dl>${f.note?`<details class="flight-notes"><summary>航班注意事項</summary><p class="prewrap">${esc(f.note)}</p></details>`:''}<div class="info-actions"><button data-action="edit-flight" data-index="${i}">編輯${i?'回程':'去程'}航班</button></div></details>`).join('')}<section class="card entry-card"><h3>入境流程與提醒</h3>${state.entryNote?`<p class="prewrap">${formattedNote(state.entryNote)}</p>`:'<p class="muted">尚未填寫入境提醒。</p>'}<div class="info-actions">${outLink('https://www.vjw.digital.go.jp/','🔍 Visit Japan Web')}<button data-action="edit-entry">編輯</button></div></section>`}
function refs(){return `<div class="page-title"><h2>收藏網址</h2><button data-action="add-ref">＋ 新增</button></div>${state.refs.map((r,i)=>`<section class="card"><h3>${esc(r.title)}</h3><p class="prewrap">${esc(r.note)}</p>${r.rowId?`<p class="muted">關聯：${esc(state.days.flatMap(d=>d.rows).find(x=>x.id===r.rowId)?.name||'原行程已刪除')}</p>`:''}<div class="info-actions">${outLink(r.url,'🔍 開啟資料')}<button data-action="edit-ref" data-index="${i}">編輯</button><button data-action="delete-ref" data-index="${i}" class="danger">刪除</button></div></section>`).join('')}`}
function book(){return `<div class="no-print page-title"><div><h2>旅遊手冊</h2><p class="muted">旅行時閱讀；行程修改請至「更多 → 行程編輯」。</p></div><div class="toolbar"><button data-action="expand-book">全部展開</button><button data-action="collapse-book">全部收合</button><button class="primary" data-action="print-options">列印／另存 PDF</button></div></div><section class="book-cover"><span class="eyebrow">旅程手帖</span><h2>${esc(state.name)}</h2><p>${state.days[0].date} — ${state.days.at(-1).date} · ${state.people} 人</p><p>預算：每人 ${budgetText(state.days)}／全體 ${budgetText(state.days,state.people)}</p></section><div class="no-print">${dayPicker()}</div><div class="handbook">${state.days.map((d,j)=>{const tt=times(d);return `<details class="book-day ${j===dayIndex?'':'book-hidden'}" data-print-day="${j}" ${j===dayIndex?'open':''}><summary>D${j+1} · ${d.date} · ${esc(d.title)}</summary><p class="muted">當日預算每人 ${budgetText([d])}</p>${d.rows.map((r,i)=>{const p=routePoints(r.id),articles=relatedArticles(r),relatedFlights=state.flights.map((f,fi)=>({f,fi})).filter(x=>(x.f.rowIds||[]).includes(r.id)),showEntry=(state.entryRowIds||[]).includes(r.id),showLuggage=(state.luggageNoteRowIds||[]).includes(r.id);return `<div class="book-row" data-book-row="${r.id}" ${i===0?`id="book-day-${j}-first"`:''}><div class="book-time">${bookTime(r,tt[i])}</div><div><span class="badge ${esc(r.category)}">${esc(labelName(r.category))}</span><h3>${esc(r.name)}</h3>${r.place?`<p class="muted">📍 ${esc(r.place)}</p>`:''}<p class="prewrap"><strong>交通：</strong>${esc(r.transport)}</p>${r.note?`<p class="prewrap"><strong>備註：</strong>${esc(r.note)}</p>`:''}<p class="muted">${money(r.cost,rowCurrency(r))}（${r.costBasis==='group'?'全員':'每人'}）${esc(r.costNote)}</p><div class="info-actions">${outLink(rowMapUrl(r),'🔍 地圖')}${rowLinkButtons(r)}</div>${articles.length?`<div class="book-related">${articles.map(a=>`<details class="book-related-details"><summary>▧ ${esc(a.name)}</summary><div class="book-related-body">${handbookInfoContent(a)}<button function finite(v,min,max){return typeof v==='number'&&Number.isFinite(v)&&v>=min&&v<=max}
function validTrip(t){const str=v=>typeof v==='string'&&v.length<=100000;const date=v=>typeof v==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(v)&&Number.isFinite(Date.parse(v));if(t&&Array.isArray(t.days)&&Array.isArray(t.flights)&&Array.isArray(t.info))upgradeTrip(t);if(!t||!str(t.name)||!str(t.id)||!finite(t.people,1,100)||!['JPY','TWD','USD','EUR','KRW','CNY','GBP','AUD','CAD','THB','SGD','HKD'].includes(t.currency)||!Array.isArray(t.days)||t.days.length<1||t.days.length>60)throw Error('旅程設定不正確');const ids=new Set();for(const d of t.days){if(!date(d.date)||!str(d.title)||!str(d.base)||!/^([01]\d|2[0-3]):[0-5]\d$/.test(d.start)||!Array.isArray(d.rows)||d.rows.length>300)throw Error('日期資料不正確');for(const r of d.rows){if(!str(r.id)||ids.has(r.id)||!['name','place','transport','note','costNote','origin','destination','url'].every(k=>str(r[k]))||!finite(r.travelMinutes,0,1440)||!finite(r.stayMinutes,0,1440)||!finite(r.duration,0,2880)||!finite(r.gap,0,1440)||!finite(r.cost,0,10000000)||r.costCurrency!=null&&!['JPY','TWD','USD','EUR','KRW','CNY','GBP','AUD','CAD','THB','SGD','HKD'].includes(r.costCurrency)||!(str(r.category)&&r.category.trim().length>0&&r.category.length<=40)||!['person','group'].includes(r.costBasis)||!['transit','walking','driving'].includes(r.mode)||r.url&&!safeUrl(r.url)||r.mapLink&&!safeUrl(r.mapLink)||!Array.isArray(r.links)||!r.links.every(x=>x&&str(x.id)&&str(x.name)&&x.name.trim()&&str(x.url)&&safeUrl(x.url)))throw Error('行程資料不正確');ids.add(r.id)}}for(const k of ['luggage','todo'])if(!Array.isArray(t[k])||!t[k].every(x=>str(x.text)&&typeof x.done==='boolean'))throw Error('清單格式不正確');if(!Array.isArray(t.luggageGroups)||!t.luggageGroups.every(str)||t.luggage.some(x=>!t.luggageGroups.includes(x.category)))throw Error('分類格式不正確');if(!Array.isArray(t.info)||!t.info.every(x=>['id','name','note','place','url','type'].every(k=>str(x[k]))&&(!x.url||safeUrl(x.url))&&(!x.bookingUrl||safeUrl(x.bookingUrl))&&(x.amount==null||x.amount===''||Number.isFinite(Number(x.amount))&&Number(x.amount)>=0)))throw Error('資訊格式不正確');if(!Array.isArray(t.refs)||!t.refs.every(x=>str(x.title)&&str(x.note)&&str(x.rowId)&&safeUrl(x.url)))throw Error('收藏格式不正確');if(!Array.isArray(t.flights)||t.flights.length!==2||!t.flights.every(x=>['airline','number','date','from','to','depart','arrive','booking','note'].every(k=>str(x[k]))&&Array.isArray(x.rowIds)&&x.rowIds.every(str)))throw Error('航班格式不正確');if(!Array.isArray(t.food)||!t.food.every(x=>['id','name','area','category','place','mapUrl','tabelogUrl','note','checkedOn'].every(k=>str(x[k]))&&finite(x.rating,4,5)&&Number.isInteger(x.reviews)&&x.reviews>=100&&(!x.mapUrl||safeUrl(x.mapUrl))&&(!x.tabelogUrl||safeUrl(x.tabelogUrl))))throw Error('餐廳收藏格式不正確');if(!str(t.luggageNote)||!str(t.entryNote)||!Array.isArray(t.entryRowIds)||!t.entryRowIds.every(str))throw Error('注意事項格式不正確');return t}
function validDb(d){if(!d||d.version!==3||!Array.isArray(d.trips)||!d.trips.length||d.trips.length>100)throw Error('備份版本或旅程數量不正確');d.trips.forEach(validTrip);if(new Set(d.trips.map(t=>t.id)).size!==d.trips.length)throw Error('旅程代碼重複');if(!d.template||!Array.isArray(d.template.groups)||!Array.isArray(d.template.items)||typeof d.template.note!=='string'||!d.template.groups.every(x=>typeof x==='string')||!d.template.items.every(x=>typeof x.text==='string'&&d.template.groups.includes(x.category)))throw Error('範本格式不正確');return d}

document.addEventListener('change',async e=>{const el=e.target,ds=el.dataset;if(ds.tableRow){saveTableCell(el)}else if(ds.tableDay){saveTableDay(el)}else if(el.hasAttribute('data-info-record-type')){$('#hotelFields').hidden=el.value!=='住宿';$('#shopParentField').hidden=el.value!=='逛街';$('#spotDiningFields').hidden=!['景點','餐飲'].includes(el.value);autoSize()}else if(el.hasAttribute('data-select-day')){dayIndex=Number(el.value);render()}else if(el.hasAttribute('data-budget')){budgetMode=Number(el.value);render()}else if(el.hasAttribute('data-info-all')){infoType=[];render()}else if(el.hasAttribute('data-info-filter')){const v=el.value;infoType=el.checked?[...new Set([...infoType,v])]:infoType.filter(x=>x!==v);render()}else if(ds.dayField){if(ds.dayField==='start'&&!/^([01]\d|2[0-3]):[0-5]\d$/.test(el.value)){toast('請填有效的出發時間');render();return}snapshot();state.days[dayIndex][ds.dayField]=el.value;commit()}else if(ds.flight!=null){state.flights[Number(ds.flight)][ds.key]=el.value;save()}else if(el.name==='entryRowIds'){state.entryRowIds=[...document.querySelectorAll('[name="entryRowIds"]:checked')].map(x=>x.value);save()}else if(ds.stateKey){state[ds.stateKey]=el.value;save()}else if(ds.check){state[ds.check][Number(ds.index)].done=el.checked;commit()}else if(el.id==='importFile'&&el.files[0]){if(el.files[0].size>5000000){toast('備份檔過大');return}importState(await el.files[0].text());el.value=''}});

document.addEventListener('submit',e=>{e.preventDefault();const f=e.target,data=new FormData(f),v=Object.fromEntries(data);try{if(f.id==='githubForm'){ghConfigure(v).catch(e=>{ghSetMessage(e.message);toast(e.message)});return}if(!ghReady||!ghToken)throw Error('請先到 GitHub 設定連線與編輯授權');if(f.id==='rowLinkForm'){const {r}=getRow(f.dataset.row),name=String(v.name||'').trim(),url=String(v.url||'').trim();if(!name)throw Error('請填網址名稱');if(!safeUrl(url))throw Error('請填有效的 http 或 https 網址');snapshot();r.links=rowLinks(r);const x=r.links.find(a=>a.id===f.dataset.link);if(x){x.name=name;x.url=url}else r.links.push({id:uid(),name,url});close();commit()}else if(f.id==='labelForm'){const name=String(v.label||'').trim(),key=f.dataset.key;if(!name)throw Error('請填標籤名稱');if(types.some(t=>t!==key&&labelName(t)===name))throw Error('標籤名稱已存在');snapshot();if(key)state.labelNames[key]=name;else {const id='label-'+uid();state.labels.push(id);state.labelNames[id]=name}syncLabels();close();commit()}else if(f.id==='flightForm'){const index=Number(f.dataset.index);if(!state.flights[index])throw Error('找不到航班');snapshot();v.rowIds=data.getAll('rowIds');state.flights[index]={...state.flights[index],...v};close();commit()}else if(f.id==='entryForm'){snapshot();state.entryNote=String(v.entryNote||'');state.entryRowIds=data.getAll('entryRowIds');close();commit()}else if(f.id==='luggageNoteForm'){snapshot();state.luggageNote=String(v.luggageNote||'');state.luggageNoteRowIds=data.getAll('luggageNoteRowIds');close();commit()}else if(f.id==='rowForm'){if(v.url&&!safeUrl(v.url)||v.mapLink&&!safeUrl(v.mapLink))throw Error('請填有效的 http 或 https 網址');v.category=v.category.trim();if(!types.includes(v.category))throw Error('請選擇既有標籤');v.name=v.name.trim();v.place=v.place.trim()||v.name;if(!v.name)throw Error('請填入行程名稱');const {r,d,i}=getRow(f.dataset.id),tt=times(d),start=i===0?v.start:d.start;if(!/^([01]\d|2[0-3]):[0-5]\d$/.test(start))throw Error('開始時間格式不正確');v.gap=0;delete v.start;for(const key of ['travelMinutes','stayMinutes','gap','cost'])v[key]=Number(v[key]);v.duration=v.travelMinutes+v.stayMinutes;if(!finite(v.travelMinutes,0,1440)||!finite(v.stayMinutes,0,1440)||!finite(v.gap,0,1440)||!finite(v.cost,0,10000000))throw Error('請填入有效的時長與費用');const proposed=structuredClone(state),pd=proposed.days[state.days.indexOf(d)];if(i===0)pd.start=start;Object.assign(pd.rows[i],v);validTrip(proposed);snapshot();if(i===0)d.start=start;Object.assign(r,v);const linkedFlights=new Set(data.getAll('linkedFlightIndexes').map(Number));state.flights.forEach((flight,fi)=>{flight.rowIds=Array.isArray(flight.rowIds)?flight.rowIds.filter(x=>x!==r.id):[];if(linkedFlights.has(fi))flight.rowIds.push(r.id)});state.entryRowIds=(state.entryRowIds||[]).filter(x=>x!==r.id);if(data.get('linkEntry'))state.entryRowIds.push(r.id);state.luggageNoteRowIds=(state.luggageNoteRowIds||[]).filter(x=>x!==r.id);if(data.get('linkLuggageNote'))state.luggageNoteRowIds.push(r.id);const linkedInfos=new Set(data.getAll('linkedInfoIds'));state.info.filter(x=>!x.parentKey).forEach(info=>{info.rowIds=Array.isArray(info.rowIds)?info.rowIds.filter(x=>x!==r.id):(info.rowId===r.id?[]:[]);if(info.rowId===r.id)info.rowId='';if(linkedInfos.has(info.id))info.rowIds.push(r.id)});close();commit()}else if(f.id==='recordForm'){const key=f.dataset.kind==='ref'?'refs':'info';if(v.url&&!safeUrl(v.url)||v.bookingUrl&&!safeUrl(v.bookingUrl))throw Error('網址格式不正確');if(key==='info'){v.rowIds=data.getAll('rowIds');delete v.rowId;if(v.amount!==''&&v.amount!=null&&(!Number.isFinite(Number(v.amount))||Number(v.amount)<0))throw Error('請填有效的金額');if(v.type!=='逛街')v.parentKey='';if(v.type==='逛街'&&!v.parentKey)v.sourceKey=(f.dataset.index!==''?state.info[Number(f.dataset.index)]?.sourceKey:'')||'area-'+uid();if(v.type==='住宿')v.hotelFieldsMigrated=true}snapshot();if(f.dataset.index===''){if(key==='info')v.id=uid();state[key].push(v)}else Object.assign(state[key][Number(f.dataset.index)],v);close();commit()}else if(f.id==='checkForm'){v.text=v.text.trim();if(!v.text)throw Error('請填項目名稱');const key=f.dataset.kind;snapshot();if(f.dataset.index==='')state[key].push({...v,done:false});else Object.assign(state[key][Number(f.dataset.index)],v);close();commit()}else if(f.id==='categoryForm'){v.name=v.name.trim();if(!v.name)throw Error('請填分類名稱');const i=f.dataset.index===''?null:Number(f.dataset.index);if(state.luggageGroups.includes(v.name)&&(i==null||state.luggageGroups[i]!==v.name))throw Error('分類名稱已存在');snapshot();if(i==null)state.luggageGroups.push(v.name);else {const old=state.luggageGroups[i];state.luggageGroups[i]=v.name;state.luggage.filter(x=>x.category===old).forEach(x=>x.category=v.name)}close();commit()}else if(f.id==='tripForm'){const original=db.trips.find(x=>x.id===f.dataset.id),copy=f.dataset.copy==='true',t=createTrip(v,original,copy);snapshot();if(original&&!copy)db.trips[db.trips.indexOf(original)]=t;else db.trips.push(t);db.activeId=t.id;dayIndex=0;budgetMode=1;active();close();go('trip');save()}else if(f.id==='printForm'){const selection={days:data.getAll('day'),extras:[]};if(!selection.days.length)throw Error('請至少選一個日期');close();preparePrint(selection);setTimeout(()=>window.print(),100)}}catch(err){toast(err.message)}});
document.addEventListener('toggle',e=>{if(e.target.tagName==='DETAILS'&&e.target.open)autoSize()},true);
window.addEventListener('resize',()=>{if(tab==='schedule')layoutSchedules()});
function registerTools(){if(!document.modelContext?.registerTool)return;for(const tool of [{name:'read_travel_itinerary',description:'Read the active travel itinerary.',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true},execute:()=>({trip:state.name,days:state.days.map(d=>({date:d.date,title:d.title,rows:d.rows.map((r,i)=>({id:r.id,name:r.name,...times(d)[i]}))}))})},{name:'move_travel_item',description:'Move or copy an item to another day in the current journey.',inputSchema:{type:'object',properties:{id:{type:'string'},day:{type:'integer',minimum:1},copy:{type:'boolean'}},required:['id','day','copy'],additionalProperties:false},execute:input=>{if(typeof input.id!=='string'||!Number.isInteger(input.day)||input.day<1||input.day>state.days.length||typeof input.copy!=='boolean')throw Error('Invalid input');moveRow(input.id,input.day-1,input.copy);return {updated:true}}}]){try{Promise.resolve(document.modelContext.registerTool(tool)).catch(()=>{})}catch{}}}
async function init(){try{sourcePack=JSON.parse(document.getElementById('travel-sources').textContent);db=validDb(JSON.parse(document.getElementById('travel-initial').textContent));active();ghLoadConfig();render();if(ghConfig&&ghToken)await ghConnect();else ghSetMessage('請設定私人儲存庫與授權碼，才能瀏覽及修改行程')}catch(err){$('#main').innerHTML='<section class="card"><h2>設定未能載入</h2><p>'+esc(err.message)+'</p></section>'}}
init();

window.addEventListener('online',()=>{ghPush().then(()=>ghPoll()).catch(()=>{})});
</script></body></html>
