function routeUrl(id){const {r}=getRow(id),p=routePoints(id);return 'https://www.google.com/maps/dir/?'+new URLSearchParams({api:'1',origin:p.origin,destination:p.destination,travelmode:r.mode||'transit'})}

function field(label,key,value,type='text',extra=''){return `<label class="field">${label}<input type="${type}" value="${esc(value)}" ${key} ${extra}></label>`}
function area(label,key,value,cls=''){return `<label class="field">${label}<textarea class="${cls}" ${key}>${esc(value)}</textarea></label>`}
function outLink(url,label,cls=''){return `<a class="link ${cls}" href="${esc(safeUrl(url))}" target="_blank" rel="noopener noreferrer">${label}</a>`}
function linkBackup(entries){return entries.map(([label,url])=>`<div class="link-backup"><label class="field">${esc(label)}<input readonly aria-label="${esc(label)}網址" value="${esc(safeUrl(url))}"></label><div class="info-actions"><button data-action="copy-link" type="button">複製網址</button><a class="link" href="${esc(safeUrl(url))}" target="_top" rel="noreferrer">在原視窗開啟</a></div></div>`).join('')}
async function copyLink(button){const input=button.closest('.link-backup').querySelector('input');try{if(!navigator.clipboard)throw Error('clipboard');await navigator.clipboard.writeText(input.value);toast('網址已複製，可貼到 Safari 或 Chrome 開啟')}catch{input.focus();input.select();input.setSelectionRange(0,input.value.length);toast('已選取網址，請長按複製後貼到瀏覽器')}}
function go(t){if(t==='table')t='trip';if(t==='food')t='more';if(t!==tab)pageHistory.push(tab);tab=t;render();window.scrollTo({top:0})}
function backPage(){tab=pageHistory.pop()||'more';render();window.scrollTo({top:0})}
function pageBack(){return '<div class="page-back no-print"><button data-action="back-page">‹ 回到前一頁</button></div>'}
function dayPicker(){return `<div class="day-picker"><button data-action="prev-day" aria-label="前一天" ${dayIndex===0?'disabled':''}>‹</button><select aria-label="選擇日期" data-select-day>${state.days.map((d,i)=>`<option value="${i}" ${i===dayIndex?'selected':''}>DAY ${i+1} · ${esc(d.date.slice(5).replace('-','/'))} · ${esc(d.title)}</option>`).join('')}</select><button data-action="next-day" aria-label="後一天" ${dayIndex===state.days.length-1?'disabled':''}>›</button></div>`}
function render(){if(!ghReady||!ghToken){document.title='私人旅程手帖';$('#tripName').textContent='私人旅程手帖';$('#tripMeta').textContent='授權後讀取私人行程';$('#nav').innerHTML='';$('#main').innerHTML=ghBanner()+githubSettings();autoSize();return}active();document.title=state.name+'｜旅程手帖';$('#tripName').textContent=state.name;$('#tripMeta').textContent=state.destination||'我的旅程';$('#nav').innerHTML=tabs.map(([id,icon,name])=>`<button data-tab="${id}" class="${id===tab||id==='lists'&&['luggage','todo'].includes(tab)||id==='more'&&['github','flights','refs','book','backup','journeys'].includes(tab)?'active':''}"><span>${icon}</span>${name}</button>`).join('');$('#main').innerHTML=ghBanner()+(['github','flights','refs','book','backup','journeys'].includes(tab)?pageBack():'')+({trip,schedule,info,lists:lists,luggage:()=>checklist('luggage'),todo:()=>checklist('todo'),more,github:githubSettings,flights,refs,book,backup,journeys}[tab]||trip)();autoSize();ghReadOnly();if(tab==='schedule')requestAnimationFrame(layoutSchedules)}
function tableInput(r,key,label,type='text',extra=''){return `<label class="table-field"><span>${label}</span><input data-table-row="${r.id}" data-table-key="${key}" type="${type}" value="${esc(r[key])}" aria-label="${esc(r.name)}：${label}" ${extra}></label>`}
function tableArea(r,key,label){return `<label class="table-field"><span>${label}</span><textarea class="table-text" rows="2" data-table-row="${r.id}" data-table-key="${key}" aria-label="${esc(r.name)}：${label}">${esc(r[key])}</textarea></label>`}
function tableSelect(r,key,label,values){return `<label class="table-field"><span>${label}</span><select data-table-row="${r.id}" data-table-key="${key}" aria-label="${esc(r.name)}：${label}">${values.map(([value,text])=>`<option value="${value}" ${r[key]===value?'selected':''}>${text}</option>`).join('')}</select></label>`}
function tableRouteLinks(r){const p=routePoints(r.id);return `${outLink(rowMapUrl(r),'地圖')}${p.origin&&p.destination?outLink(routeUrl(r.id),'A→B 路線'):''}${r.url?outLink(r.url,'官網／收藏'):''}<small class="muted">${esc(p.origin||'起點待填')} → ${esc(p.destination)}</small>`}
function itineraryTable(){const d=state.days[dayIndex],tt=times(d);return `<div class="page-title"><div><h2>行程</h2><p class="muted">${esc(state.days[0].date)} — ${esc(state.days.at(-1).date)} · ${state.people} 人</p></div><div class="toolbar"><button data-action="undo" ${undoState?'':'disabled'}>復原</button><button data-tab="schedule">時刻表</button></div></div>${dayPicker()}<p class="muted">直接修改，離開欄位即儲存。時間自動重算，其他資料與操作可展開「其他設定」。</p><details class="table-day-settings"><summary>當日設定 · ${esc(d.title)}</summary><div class="table-day-fields">${field('當日標題','data-table-day="title"',d.title)}${field('每日出發時間','data-table-day="start"',d.start,'time','required')}${field('第一段路線起點','data-table-day="base"',d.base)}</div></details><div class="budget"><select data-budget aria-label="預算顯示"><option value="1" ${budgetMode===1?'selected':''}>每人</option><option value="${state.people}" ${budgetMode===state.people&&budgetMode!==1?'selected':''}>${state.people}人合計</option></select><p class="table-budget muted" data-table-budget>今日 ${money(total(d)*budgetMode)} · 全程 ${money(state.days.reduce((n,x)=>n+total(x),0)*budgetMode)}</p></div><div class="itinerary-table-wrap"><table class="itinerary-table"><caption class="sr-only">${esc(d.date)} ${esc(d.title)}行程資料</caption><thead><tr><th scope="col">抵達</th><th scope="col">行程</th><th scope="col">交通方式</th><th scope="col">交通／停留</th><th scope="col">費用</th></tr></thead>${d.rows.map((r,i)=>`<tbody data-table-id="${r.id}"><tr class="table-primary"><td class="table-time"><small>抵達</small><strong data-table-arrival>${fmt(tt[i].arrival)}</strong><small>預計結束</small><span data-table-end>${fmt(tt[i].end)}</span></td><td class="table-name-cell"><span class="badge ${esc(r.category)}" data-table-badge>${esc(r.category)}</span>${tableInput(r,'name','行程名稱','text','required')}</td><td class="table-transport-cell">${tableArea(r,'transport','交通方式／路線')}</td><td class="table-duration-cell"><div class="table-duration-inputs">${tableInput(r,'travelMinutes','交通（分）','number','min="0" max="1440" step="1" required')}${tableInput(r,'stayMinutes','停留（分）','number','min="0" max="1440" step="1" required')}</div><small class="muted" data-table-total>合計 ${r.duration} 分鐘</small></td><td class="table-cost-cell">${tableInput(r,'cost','費用（'+esc(state.currency)+'）','number','min="0" max="10000000" step="any" required')}<small data-table-cost-basis>${r.costBasis==='group'?'全體共用':'每人'}</small></td></tr><tr class="table-secondary"><td colspan="5"><div class="table-quick-actions"><button data-action="table-shift" data-dir="-1" data-id="${r.id}" ${i===0?'disabled':''}>↑</button><button data-action="table-shift" data-dir="1" data-id="${r.id}" ${i===d.rows.length-1?'disabled':''}>↓</button><div class="table-links">${tableRouteLinks(r)}</div></div><details class="table-extra"><summary>備註／其他設定</summary><div class="table-extra-fields">${tableArea(r,'note','備註／說明')}${tableSelect(r,'category','類別',types.map(x=>[x,x]))}${tableInput(r,'place','Google Maps 地點')}${tableSelect(r,'costBasis','費用基準',[['person','每人'],['group','全體共用']])}${tableArea(r,'costNote','費用說明')}${tableSelect(r,'mode','導航交通方式',[['transit','大眾運輸'],['walking','步行'],['driving','開車／計程車']])}${tableInput(r,'mapLink','地圖網址（留白自動搜尋）','url')}${tableInput(r,'url','官網／收藏／時刻表網址','url')}${tableInput(r,'origin','A→B 起點（留白自動帶入）')}${tableInput(r,'destination','A→B 終點（留白自動帶入）')}</div><div class="table-related">${relatedLinks(r)}</div><div class="table-row-actions"><button data-action="table-duplicate" data-id="${r.id}">複製本列</button><label class="table-field"><span>移動／複製到</span><select data-table-target aria-label="${esc(r.name)}移動或複製目標日期">${state.days.map((x,j)=>`<option value="${j}" ${x===d?'selected':''}>D${j+1} · ${esc(x.date.slice(5))}</option>`).join('')}</select></label><button data-action="table-transfer" data-id="${r.id}" data-copy="false">移動</button><button data-action="table-transfer" data-id="${r.id}" data-copy="true">複製到該日</button><button data-action="delete-row" class="danger" data-id="${r.id}">刪除</button></div></details></td></tr></tbody>`).join('')}</table></div>${!d.rows.length?'<p class="empty">尚無行程，新增一列開始編輯。</p>':''}<button data-action="table-add" class="primary full">＋ 新增一列行程</button>`}
function refreshTableComputed(){if(tab!=='trip')return;const d=state.days[dayIndex],tt=times(d);d.rows.forEach((r,i)=>{const row=document.querySelector(`[data-table-id="${r.id}"]`);if(!row)return;row.querySelector('[data-table-arrival]').textContent=fmt(tt[i].arrival);row.querySelector('[data-table-end]').textContent=fmt(tt[i].end);row.querySelector('[data-table-total]').textContent='合計 '+r.duration+' 分鐘';const badge=row.querySelector('[data-table-badge]');badge.className='badge '+r.category;badge.textContent=r.category;const basis=row.querySelector('[data-table-cost-basis]');if(basis)basis.textContent=r.costBasis==='group'?'全體共用':'每人';row.querySelector('.table-links').innerHTML=tableRouteLinks(r);row.querySelector('.table-related').innerHTML=relatedLinks(r)});const budget=document.querySelector('[data-table-budget]');if(budget)budget.textContent='今日 '+money(total(d)*budgetMode)+' · 全程 '+money(state.days.reduce((n,x)=>n+total(x),0)*budgetMode);document.querySelectorAll('[data-action="undo"]').forEach(b=>b.disabled=!undoState)}
function saveTableCell(el){const key=el.dataset.tableKey,allowed=['name','place','transport','category','travelMinutes','stayMinutes','cost','costBasis','costNote','note','mode','mapLink','url','origin','destination'];if(!allowed.includes(key))return;const {r,d,i}=getRow(el.dataset.tableRow),original=r[key];try{let value=el.value;if(['travelMinutes','stayMinutes','cost'].includes(key)){if(value.trim()==='')throw Error('時間與費用不可留白，沒有請填 0');value=Number(value)}if(key==='name'){value=value.trim();if(!value)throw Error('請填入行程名稱')}if(['url','mapLink'].includes(key)&&value&&!safeUrl(value))throw Error('請填有效的 http 或 https 網址');const proposed=structuredClone(state),row=proposed.days[state.days.indexOf(d)].rows[i];row[key]=value;row.duration=row.travelMinutes+row.stayMinutes;validTrip(proposed);if(original===value){el.removeAttribute('aria-invalid');return}snapshot();r[key]=value;r.duration=r.travelMinutes+r.stayMinutes;save();el.value=String(value);el.removeAttribute('aria-invalid');refreshTableComputed()}catch(e){el.value=String(original);el.setAttribute('aria-invalid','true');toast(e.message)}}
function saveTableDay(el){const key=el.dataset.tableDay;if(!['start','title','base'].includes(key))return;const d=state.days[dayIndex],old=d[key];try{const proposed=structuredClone(state);proposed.days[dayIndex][key]=el.value;validTrip(proposed);if(old===el.value)return;snapshot();d[key]=el.value;save();refreshTableComputed()}catch(e){el.value=old;toast(e.message)}}
function tableCommit(){const wrap=document.querySelector('.itinerary-table-wrap'),left=wrap?.scrollLeft||0;commit();const next=document.querySelector('.itinerary-table-wrap');if(next)next.scrollLeft=left}
function trip(){return itineraryTable()}
function relatedArticles(r){const text=r.name+' '+r.place;return state.info.filter(x=>x.sourceKey&&!x.parentKey&&(x.sourceKey==='09-txt'&&/京都[駅站]|京都車站/.test(text)||x.sourceKey==='12-txt'&&/河原町|寺町|四条|四條/.test(text)||x.sourceKey==='11-txt'&&/Odysis|奧德西斯|接駁|関西|關西/.test(text)||x.sourceKey==='10-txt'&&r.category==='逛街'))}
function relatedLinks(r){const a=relatedArticles(r);return `<div class="related-links">${state.refs.filter(x=>x.rowId===r.id).map(x=>outLink(x.url,esc(x.title))).join('')}${a.map(x=>`<button data-action="article" data-id="${x.id}">▧ ${esc(x.name)}</button>`).join('')}${/關西機場|関西国際空港/.test(r.name+' '+r.place)?'<button data-tab="flights">✈ 航班與入境</button>':''}</div>`}
function schedule(){return `<div class="page-title"><h2>時刻表</h2><div class="segmented"><button data-schedule-mode="day" class="${scheduleMode==='day'?'selected':''}">單日</button><button data-schedule-mode="week" class="${scheduleMode==='week'?'selected':''}">全程課表</button></div></div><div class="legend">${types.map(x=>`<span class="badge ${x}">${x}</span>`).join('')}</div><p class="muted">方塊隨時間長短調整高度；短行程保留文字所需的最小高度，不再放大整張表。</p>${scheduleMode==='day'?dayPicker():''}${scheduleCanvas(scheduleMode==='day'?[dayIndex]:state.days.map((_,i)=>i))}`}
function scheduleZeroNotes(indices){return indices.map(j=>{const d=state.days[j],tt=times(d),rows=d.rows.map((r,i)=>r.duration===0?`<button data-action="detail" data-id="${r.id}" class="zero-event ${esc(r.category)}"><small>${fmt(tt[i].start)} · 0 分鐘</small><span>${esc(r.name)}</span></button>`:'').join('');return rows?`<section class="card zero-events"><h3>D${j+1} · ${esc(d.date)} · 0 分鐘行程</h3><p class="muted">不占用時間，後續行程接續同一時刻。</p>${rows}</section>`:''}).join('')}
function scheduleCanvas(indices){const all=indices.flatMap(j=>times(state.days[j])),start=all.length?Math.floor(Math.min(...all.map(t=>t.start))/60)*60:480,end=all.length?Math.ceil(Math.max(...all.map(t=>t.end))/60)*60:1200,scale=0.8;return `${scheduleZeroNotes(indices)}<div class="schedule-wrap ${indices.length===1?'single':''}"><div class="schedule-grid" data-axis-start="${start}" data-axis-end="${end}" style="--columns:${indices.length};--hour-height:${60*scale}px"><div class="schedule-corner">時間</div>${indices.map(j=>`<div class="schedule-heading">D${j+1} · ${state.days[j].date.slice(5)}</div>`).join('')}<div class="time-axis" style="height:${(end-start)*scale}px">${Array.from({length:Math.max(1,(end-start)/60+1)},(_,i)=>`<span data-minute="${start+i*60}" style="top:${i*60*scale}px">${fmt(start+i*60)}</span>`).join('')}</div>${indices.map(j=>{const d=state.days[j],tt=times(d);return `<div class="schedule-column" style="height:${(end-start)*scale}px">${d.rows.map((r,i)=>r.duration===0?'':`<button class="event-label ${esc(r.category)}" data-action="detail" data-id="${r.id}" data-start="${tt[i].start}" data-duration="${r.duration}" style="top:${(tt[i].start-start)*scale}px;height:${r.duration*scale}px" aria-label="${esc(r.name)}，${r.duration}分鐘"><small>${fmt(tt[i].start)}–${fmt(tt[i].end)}</small><span>${esc(r.name)}</span><small>交通 ${r.travelMinutes} 分 · 停留 ${r.stayMinutes} 分</small></button>`).join('')}</div>`}).join('')}</div></div>`}
function scheduleCoordinates(start,end,events){const bounds=[...new Set([start,end,...events.flatMap(e=>[e.start,e.start+e.duration])])].sort((a,b)=>a-b),heights=bounds.slice(1).map((v,i)=>(v-bounds[i])*.8);for(const e of events){const first=bounds.indexOf(e.start),last=bounds.indexOf(e.start+e.duration);if(last<=first)continue;const current=heights.slice(first,last).reduce((a,b)=>a+b,0),extra=Math.max(0,e.height+4-current);for(let i=first;i<last;i++)heights[i]+=extra*(bounds[i+1]-bounds[i])/e.duration}const positions=[0];heights.forEach(h=>positions.push(positions.at(-1)+h));return minute=>{if(minute<=start)return 0;if(minute>=end)return positions.at(-1);const i=bounds.findIndex(v=>v>minute)-1;return positions[i]+(minute-bounds[i])/(bounds[i+1]-bounds[i])*heights[i]}}
function layoutSchedules(){document.querySelectorAll('.schedule-grid').forEach(grid=>{const labels=[...grid.querySelectorAll('.event-label')].filter(label=>Number(label.dataset.duration)>0),start=Number(grid.dataset.axisStart),end=Number(grid.dataset.axisEnd),events=labels.map(label=>{label.style.height='auto';return {start:Number(label.dataset.start),duration:Number(label.dataset.duration),height:Math.ceil(label.getBoundingClientRect().height)}}),coordinate=scheduleCoordinates(start,end,events);labels.forEach((label,i)=>{const e=events[i];label.style.top=coordinate(e.start)+'px';label.style.height=(coordinate(e.start+e.duration)-coordinate(e.start))+'px'});grid.querySelectorAll('.schedule-column,.time-axis').forEach(col=>col.style.height=coordinate(end)+'px');grid.querySelectorAll('.time-axis span').forEach(tick=>tick.style.top=coordinate(Number(tick.dataset.minute))+'px')})}
function hotelContent(v){const fields=[['地址',v.address],['電話',v.phone],['入住時間',v.checkIn],['退房時間',v.checkOut],['金額',v.amount!==''&&v.amount!=null?money(Number(v.amount)): ''],['預約號碼',v.reservation],['PIN 碼',v.pin],['訂房平台',v.bookingPlatform]];return `<dl class="hotel-details">${fields.map(([label,value])=>`<div><dt>${label}</dt><dd>${esc(value||'待填')}</dd></div>`).join('')}</dl><h4>備註</h4><p class="prewrap">${esc(v.note)}</p>${v.bookingUrl?outLink(v.bookingUrl,'🔍 '+esc(v.bookingPlatform||'訂房平台')+' 訂單'):''}`}
function hotelDefaults(v){for(const k of ['address','phone','checkIn','checkOut','amount','reservation','pin','bookingPlatform','bookingUrl'])v[k]??='';if(!v.hotelFieldsMigrated){v.address||=(v.note.match(/地址[：:]([^\n]+)/)?.[1]||'').trim();v.checkIn||=v.note.match(/入住\s*(\d{1,2}:\d{2})/)?.[1]||'';v.checkOut||=v.note.match(/退房\s*(\d{1,2}:\d{2})/)?.[1]||'';v.hotelFieldsMigrated=true}return v}
function transportEstimate(text){const groups=[...String(text).matchAll(/(\d+)\s*(?:[–—~～-]\s*(\d+)\s*)?分/g)];return groups.reduce((n,m)=>n+Number(m[2]||m[1]),0)}
function splitRowTime(r){if(r.travelMinutes==null&&r.stayMinutes==null){const total=r.duration;let travel=r.category==='交通'?total:Math.min(total,transportEstimate(r.transport));r.travelMinutes=travel;r.stayMinutes=total-travel}if(r.travelMinutes==null)r.travelMinutes=0;if(r.stayMinutes==null)r.stayMinutes=0;r.duration=r.travelMinutes+r.stayMinutes;if(!r.transportMethodFilled){const description=String(r.transport||'').trim(),method=r.name.match(/(?:JR(?:湖西線|嵯峨野線)?|京都巴士\d+號|Haruka\s*\d*號?)/)?.[0];if(method&&!/JR|巴士|Haruka/i.test(description))r.transport=method+' · '+description;if(!description||/^[–—-]$/.test(description))r.transport=r.travelMinutes===0?'無交通移動':'交通方式待填';r.transportMethodFilled=true}r.mapLink??='';r.gap=0;return r}
function upgradeTrip(t){t.food||=[];t.days.forEach(d=>d.rows.forEach(splitRowTime));t.flights.forEach(f=>{delete f.terminal;delete f.arrivalTerminal});t.info.forEach(v=>{v.type=({'飯店':'住宿','餐廳':'餐飲','購物':'逛街'})[v.type]||v.type;if(!types.includes(v.type))v.type='其他';if(v.type==='住宿')hotelDefaults(v);if(v.type==='逛街'&&!v.parentKey)v.sourceKey||='area-'+v.id});return t}
function formattedNote(text){const pattern=/\*\*([^*\n]+)\*\*|(禁止[^：:\n]*|不得[^，。；\n]*|務必[^，。；\n]*|單瓶不得超過一百毫升|一公升|100\s*ml|100\s*毫升|20×20公分|7\s*KG|23\s*KG|158公分|203公分|行動電源|鋰電池|手提行李|託運行李|托運行李)/gi;let result='',last=0;for(const m of String(text).matchAll(pattern)){result+=esc(text.slice(last,m.index));result+=`<strong class="${m[1]?'note-emphasis':/禁止|不得|務必/.test(m[0])?'note-danger':'note-key'}">${esc(m[1]||m[2])}</strong>`;last=m.index+m[0].length}return result+esc(text.slice(last))}
function packingRules(){const airline=state.flights.some(f=>/國泰|Cathay/i.test(f.airline));return airline?`<div class="verified-packing"><h4>國泰航空攜帶重點</h4><ul><li><strong class="note-danger">行動電源不可託運，也不可放在頭頂行李櫃。</strong>應放在前方座位下的隨身行李。</li><li><strong class="note-key">每人最多 2 個行動電源。</strong>機上不可使用行動電源，也不可替行動電源充電。</li><li>液體、膠狀與噴霧用品一般以<strong class="note-key">每個容器不超過 100 ml</strong>，放入<strong class="note-key">每人一個、容量不超過 1 L 的透明可重複密封袋</strong>。</li></ul><p class="muted">2026/10/03 核對國泰官網；特殊液體與容量等細則請開啟官方規定。重量與件數以你的機票額度為準。</p><div class="info-actions">${outLink('https://www.cathaypacific.com/cx/en_TW/baggage/controlled-and-banned-items/lithium-batteries.html','🔍 行動電源規定')}${outLink('https://www.cathaypacific.com/cx/en_TW/baggage/controlled-and-banned-items/controlled-items.html','🔍 受管制物品')}</div></div>`:''}
function infoContent(v){return `${v.type==='住宿'?hotelContent(v):`<p class="prewrap">${esc(v.note)}</p>`}${state.info.filter(x=>v.sourceKey&&x.parentKey===v.sourceKey).map(x=>`<details class="shop-card"><summary><strong>${esc(x.name)}</strong></summary><p class="prewrap">${esc(x.note)}</p><div class="info-actions">${x.place?outLink(mapUrl(x.place),'🔍 地圖'):''}${x.url?outLink(x.url,'🔍 來源'):''}<button data-action="edit-info" data-index="${state.info.indexOf(x)}">編輯店家</button><button data-action="delete-info" data-index="${state.info.indexOf(x)}" class="danger">刪除</button></div></details>`).join('')}${v.type==='逛街'&&!v.parentKey?`<button data-action="add-shop" data-parent-key="${esc(v.sourceKey)}" class="add-shop">＋ 新增店家</button>`:''}`}
function info(){const shown=state.info.map((v,i)=>({v,i})).filter(({v})=>!v.parentKey&&(infoType==='全部'||v.type===infoType));return `<div class="page-title"><h2>旅途資訊</h2><button data-action="add-info">＋ 新增</button></div><label class="field compact">分類<select data-info-type>${options(['全部',...types],infoType)}</select></label>${shown.map(({v,i})=>`<details class="card info-card"><summary><span class="badge ${esc(v.type)}">${esc(v.type)}${v.region?' · '+esc(v.region):''}</span><h3>${esc(v.name)}</h3></summary>${infoContent(v)}<div class="info-actions">${v.place?outLink(mapUrl(v.place),'🔍 地圖'):''}${v.url?outLink(v.url,'🔍 來源／官網'):''}<button data-action="edit-info" data-index="${i}">編輯</button><button class="danger" data-action="delete-info" data-index="${i}">刪除</button></div></details>`).join('')}`}
function lists(){return `<div class="page-title"><h2>旅行清單</h2></div><div class="segmented"><button data-list-mode="luggage" class="${listMode==='luggage'?'selected':''}">行李準備</button><button data-list-mode="todo" class="${listMode==='todo'?'selected':''}">待辦事項</button></div>${checklist(listMode)}`}
function checkRow(v,i,kind){return `<div class="checkrow ${v.done?'checked':''}"><input type="checkbox" aria-label="完成${esc(v.text)}" data-check="${kind}" data-index="${i}" ${v.done?'checked':''}><span class="checktext">${esc(v.text)}</span><button data-action="edit-check" data-kind="${kind}" data-index="${i}" aria-label="編輯${esc(v.text)}">編輯</button><button data-action="delete-check" class="icon-danger" data-kind="${kind}" data-index="${i}" aria-label="刪除${esc(v.text)}">×</button></div>`}
function checklist(kind){const list=state[kind],done=list.filter(x=>x.done).length;return `<div class="progress-summary"><h3>${kind==='luggage'?'行李準備':'待辦事項'}</h3><span>${done}／${list.length} 完成</span><progress value="${done}" max="${list.length||1}"></progress></div>${kind==='luggage'?state.luggageGroups.map((c,j)=>{const items=list.map((v,i)=>({v,i})).filter(x=>x.v.category===c);return `<details class="card category-card" open><summary><strong>${esc(c)}</strong><span>${items.filter(x=>x.v.done).length}／${items.length}</span></summary>${items.map(({v,i})=>checkRow(v,i,kind)).join('')}<div class="category-actions"><button data-action="add-check" data-kind="luggage" data-category="${esc(c)}">＋ 新增項目</button><button data-action="edit-category" data-index="${j}">調整分類</button></div></details>`}).join(''):`<section class="card">${list.map((v,i)=>checkRow(v,i,kind)).join('')}<button data-action="add-check" data-kind="todo">＋ 新增待辦</button></section>`}${kind==='luggage'?`<div class="toolbar"><button data-action="add-category">＋ 新增分類</button><button data-action="save-template">存為共用行李範本</button></div><section class="card"><h3>行李攜帶注意事項</h3>${packingRules()}<details open><summary>查看注意事項</summary><div class="prewrap luggage-rich">${formattedNote(state.luggageNote)}</div></details><details><summary>編輯注意事項</summary>${area('可換行；用 **文字** 自訂粗體，關鍵字會自動標色','data-state-key="luggageNote"',state.luggageNote,'large-note')}</details><p class="muted">原始收藏中的攜帶規定與行李額度尚待核對；可附上航空公司與機場公告網址。</p></section>`:''}`}
function more(){return `<h2>更多</h2><div class="menu-grid">${[['github','GitHub 同步','共用資料與手機編輯授權'],['journeys','我的旅程','新增、複製與切換旅行'],['flights','航班與入境','航班資料、入境流程'],['refs','收藏網址','連結與個人筆記'],['book','手冊／PDF','每日收合與列印'],['backup','備份與轉移','目前旅程或全部旅程']].map(([t,n,s])=>`<button data-tab="${t}" class="menu-card"><strong>${n}</strong><small>${s}</small></button>`).join('')}</div>`}
function flightFields(){return [['航空公司','airline'],['航班號碼','number'],['日期','date','date'],['出發機場','from'],['抵達機場','to'],['起飛時間','depart','time'],['抵達時間','arrive','time'],['訂位代號','booking']]}
function editFlight(i){const f=state.flights[i];if(!f)return;modal(`${modalHeader(i?'編輯回程航班':'編輯去程航班')}<form id="flightForm" data-index="${i}"><div class="fields">${flightFields().map(([l,k,t])=>field(l,`name="${k}"`,f[k],t||'text')).join('')}</div>${area('航班注意事項','name="note"',f.note,'flight-note')}<div class="modalactions"><button type="button" data-action="close">取消</button><button class="primary">儲存</button></div></form>`)}
function flights(){return `<div class="page-title"><h2>航班與入境</h2><button data-tab="trip">回到行程</button></div><p class="muted">時間依當地時間填寫。</p>${state.flights.map((f,i)=>`<details class="card flight-card"><summary><strong>${i?'回程':'去程'}</strong><span class="muted">${esc(f.date)} · ${esc(f.number||f.airline||'航班待填')}</span></summary><dl class="hotel-details">${flightFields().map(([l,k])=>`<div><dt>${l}</dt><dd>${esc(f[k]||'待填')}</dd></div>`).join('')}</dl>${f.note?`<details class="flight-notes"><summary>航班注意事項</summary><p class="prewrap">${esc(f.note)}</p></details>`:''}<div class="info-actions"><button data-action="edit-flight" data-index="${i}">編輯${i?'回程':'去程'}航班</button></div></details>`).join('')}<details class="card entry-card"><summary><strong>入境流程與提醒</strong></summary><p class="prewrap">${esc(state.entryNote)}</p><details><summary>編輯入境資料</summary>${area('入境與其他提醒','data-state-key="entryNote"',state.entryNote,'entry-note')}</details>${outLink('https://www.vjw.digital.go.jp/','🔍 Visit Japan Web')}</details>`}

function refs(){return `<div class="page-title"><h2>收藏網址</h2><button data-action="add-ref">＋ 新增</button></div>${state.refs.map((r,i)=>`<section class="card"><h3>${esc(r.title)}</h3><p class="prewrap">${esc(r.note)}</p>${r.rowId?`<p class="muted">關聯：${esc(state.days.flatMap(d=>d.rows).find(x=>x.id===r.rowId)?.name||'原行程已刪除')}</p>`:''}<div class="info-actions">${outLink(r.url,'🔍 開啟資料')}<button data-action="edit-ref" data-index="${i}">編輯</button><button data-action="delete-ref" data-index="${i}" class="danger">刪除</button></div></section>`).join('')}`}
function book(){return `<div class="no-print"><h2>旅遊手冊／PDF</h2><div class="toolbar"><button data-action="expand-book">全部展開</button><button data-action="collapse-book">全部收合</button><button class="primary" data-action="print-options">列印／另存 PDF</button></div></div><div class="handbook"><section class="book-cover"><span class="eyebrow">旅程手帖</span><h2>${esc(state.name)}</h2><p>${state.days[0].date} — ${state.days.at(-1).date} · ${state.people} 人</p><p>預算：每人 ${money(state.days.reduce((s,d)=>s+total(d),0))}／全體 ${money(state.days.reduce((s,d)=>s+total(d),0)*state.people)}</p></section>${state.days.map((d,j)=>{const tt=times(d);return `<details class="book-day" data-print-day="${j}" ${j===dayIndex?'open':''}><summary>D${j+1} · ${d.date} · ${esc(d.title)}</summary><p class="muted">當日預算每人 ${money(total(d))}</p>${d.rows.map((r,i)=>`<div class="book-row"><div class="book-time">抵達<br>${fmt(tt[i].arrival)}</div><div><span class="badge ${esc(r.category)}">${esc(r.category)}</span><h3>${esc(r.name)}</h3><p>交通時間 ${r.travelMinutes} 分鐘 · 預計停留時間 ${r.stayMinutes} 分鐘</p><p class="prewrap">交通方式：${esc(r.transport)}</p><p class="prewrap">${esc(r.note)}</p><p class="muted">${money(r.cost)}（${r.costBasis==='group'?'全體':'每人'}）${esc(r.costNote)}</p><div class="info-actions">${outLink(rowMapUrl(r),'🔍 地圖')}${outLink(routeUrl(r.id),'A→B 路線')}${r.url?outLink(r.url,'資料來源'):''}</div></div></div>`).join('')}</details>`}).join('')}<details class="book-extra" data-print-extra="flights"><summary>航班與入境</summary>${state.flights.map((f,i)=>`<p>${i?'回程':'去程'}：${esc(f.date)} ${esc(f.airline)} ${esc(f.number)}<br>${esc(f.from)} ${esc(f.depart||'待填')} → ${esc(f.to)} ${esc(f.arrive||'待填')}<br>${esc(f.note)}</p>`).join('')}<p class="prewrap">${esc(state.entryNote)}</p></details><details class="book-extra" data-print-extra="info"><summary>住宿與旅途資訊</summary>${state.info.map(v=>`<h3>${esc(v.name)}</h3>${v.type==='住宿'?hotelContent(v):`<p class="prewrap">${esc(v.note)}</p>`}${v.url?`<p>${outLink(v.url,'來源網址')}</p>`:''}`).join('')}</details><details class="book-extra" data-print-extra="lists"><summary>行李與待辦</summary>${['luggage','todo'].map(k=>`<h3>${k==='luggage'?'行李':'待辦'}</h3>${state[k].map(v=>`<p>${v.done?'☑':'☐'} ${k==='luggage'?esc(v.category)+' · ':''}${esc(v.text)}</p>`).join('')}`).join('')}<div class="prewrap luggage-rich">${formattedNote(state.luggageNote)}</div></details><details class="book-extra" data-print-extra="refs"><summary>收藏網址</summary>${state.refs.map(r=>`<h3>${esc(r.title)}</h3><p>${esc(r.url)}</p><p class="prewrap">${esc(r.note)}</p>`).join('')}</details></div>`}
function backupPayload(scope='all'){return scope==='current'?{version:3,kind:'trip',trip:state}:{...db,kind:'all'}}
function downloadHtml(){const clone=document.documentElement.cloneNode(true);clone.querySelector('#travel-published-data').textContent='null';clone.querySelector('#travel-github-config').textContent='null';clone.querySelector('#main').innerHTML='';clone.querySelector('#nav').innerHTML='';clone.querySelector('#modalBody').innerHTML='';clone.querySelector('#modal').removeAttribute('open');clone.querySelector('#toast').hidden=true;clone.querySelector('title').textContent='私人旅程手帖';clone.querySelector('#tripName').textContent='私人旅程手帖';clone.querySelector('#tripMeta').textContent='授權後讀取私人行程';clone.querySelector('#saveState').textContent='尚未連線';const url=URL.createObjectURL(new Blob(['<!doctype html>\n'+clone.outerHTML],{type:'text/html;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='index.html';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('已下載介面 HTML，不含行程資料或授權碼')}
function backup(){return `<h2>備份與轉移</h2><p>共用資料讀寫 GitHub；本機備份用於意外復原。正常換手機只需連線同一個儲存庫，不必匯入。</p><section class="card"><h3>下載網站 HTML</h3><p>包含目前全部旅程。只下載公開介面，不包含行程資料、儲存庫設定或授權碼。</p><button data-action="download-html">下載介面 HTML（不含個人資料）</button></section><section class="card"><h3>匯出備份</h3><label class="field">範圍<select id="exportScope"><option value="current">目前旅程</option><option value="all">全部旅程與共用範本</option></select></label><div class="toolbar"><button class="primary" data-action="download">下載備份檔</button><button data-action="copy">複製文字</button></div><details><summary>全部備份文字</summary><textarea class="backuptext" id="exportText" readonly>${esc(JSON.stringify(backupPayload('all'),null,2))}</textarea></details></section><section class="card"><h3>匯入備份</h3><p class="muted">單一旅程備份會加入目前旅程清單；全部備份會取代全部資料。可匯入舊版京都備份。</p><label class="field">選擇 JSON 檔案<input type="file" accept=".json,application/json" id="importFile"></label><textarea id="importText" class="backuptext" aria-label="備份文字" placeholder="或貼上備份文字"></textarea><button data-action="import" class="primary">匯入備份</button></section>`}
function journeys(){return `<div class="page-title"><h2>我的旅程</h2><button class="primary" data-action="new-trip">＋ 新旅程</button></div>${db.trips.map(t=>`<section class="card journey-card"><span class="badge">${t.id===state.id?'目前旅程':esc(t.destination||'旅程')}</span><h3>${esc(t.name)}</h3><p>${t.days[0].date} — ${t.days.at(-1).date} · ${t.days.length} 天 · ${t.people} 人</p><div class="toolbar"><button data-action="switch-trip" data-id="${t.id}" class="primary">開啟</button><button data-action="edit-trip" data-id="${t.id}">設定</button><button data-action="duplicate-trip" data-id="${t.id}">複製</button><button data-action="delete-trip" data-id="${t.id}" class="danger" ${db.trips.length===1?'disabled':''}>刪除</button></div></section>`).join('')}`}
function modal(html){if($('#modal').open)$('#modal').close();$('#modalBody').innerHTML=html;$('#modal').showModal();autoSize()}
function close(){$('#modal').close()}
function modalHeader(title){return `<div class="modalhead"><h3>${esc(title)}</h3><button data-action="close" aria-label="關閉">✕</button></div>`}
function editRow(id){const {r,d,i}=getRow(id),t=times(d)[i],p=routePoints(id);modal(`${modalHeader('編輯行程')}<form id="rowForm" data-id="${id}">${field('行程名稱','name="name"',r.name,'text','required')}${field('Google Maps 地點（留白使用行程名稱）','name="place"',r.place)}${field('地圖網址（留白自動搜尋地點）','name="mapLink"',r.mapLink||'','url')}<div class="fields">${i===0?field('每日出發時間','name="start"',d.start,'time','required'):`<p class="muted">抵達 ${fmt(t.arrival)}（接續前段行程）</p>`}${field('交通時間（分鐘）','name="travelMinutes"',r.travelMinutes,'number','min="0" max="1440" required')}${field('預計停留時間（分鐘）','name="stayMinutes"',r.stayMinutes,'number','min="0" max="1440" required')}${field('費用','name="cost"',r.cost,'number','min="0" required')}</div><div class="fields"><label class="field">費用基準<select name="costBasis"><option value="person" ${r.costBasis==='person'?'selected':''}>每人</option><option value="group" ${r.costBasis==='group'?'selected':''}>全體共用</option></select></label><label class="field">類別<select name="category">${options(types,r.category)}</select></label></div>${area('交通方式／路線說明','name="transport"',r.transport)}<p class="muted">抵達時間＝前一行程結束＋交通時間；下一行程接續抵達時間＋預計停留。兩個時間皆可填 0。</p>${area('備註／說明','name="note"',r.note,'large-note')}${field('費用說明','name="costNote"',r.costNote)}${field('官網／收藏／時刻表網址','name="url"',r.url,'url')}<label class="field">路線交通方式<select name="mode">${[['transit','大眾運輸'],['walking','步行'],['driving','開車／計程車']].map(([v,n])=>`<option value="${v}" ${r.mode===v?'selected':''}>${n}</option>`).join('')}</select></label><p class="muted">自動路線：${esc(p.origin)} → ${esc(p.destination)}</p><details><summary>路線起訖點（需要不同路線時再填）</summary><p class="muted">地圖網址用來開啟單一地點；這裡只調整 A→B 導航的出發地與目的地。</p>${field('起點（留白自動帶入）','name="origin"',r.origin||'')}${field('終點（留白使用目前地點）','name="destination"',r.destination||'')}</details><div class="modalactions"><button type="button" data-action="close">取消</button><button class="primary">儲存</button></div></form>`)}
function detail(id){const {r,d,i}=getRow(id),t=times(d)[i],linked=state.refs.filter(x=>x.rowId===id);modal(`${modalHeader(r.name)}<span class="badge ${esc(r.category)}">${esc(r.category)}</span><p>抵達 ${fmt(t.arrival)} · 預計結束 ${fmt(t.end)}</p><p>交通時間 ${r.travelMinutes} 分鐘 · 預計停留時間 ${r.stayMinutes} 分鐘</p><p class="prewrap">交通方式：${esc(r.transport)}</p><p class="prewrap">${esc(r.note)}</p><div class="info-actions">${outLink(rowMapUrl(r),'🔍 地圖')}${outLink(routeUrl(id),'A→B 路線')}${r.url?outLink(r.url,'收藏連結'):''}</div><details><summary>連結無法開啟？</summary>${linkBackup([['Google 地圖',rowMapUrl(r)],['A→B 路線',routeUrl(id)]])}</details>${relatedLinks(r)}${linked.map(x=>`<p>${outLink(x.url,'🔍 '+esc(x.title))}</p>`).join('')}<div class="modalactions"><button data-action="edit" data-id="${id}">編輯</button><button data-action="open-row" data-id="${id}">回到行程</button></div>`)}
function article(id){const v=state.info.find(x=>x.id===id);if(!v)return;modal(`${modalHeader(v.name)}${infoContent(v)}<div class="info-actions">${v.place?outLink(mapUrl(v.place),'🔍 地圖'):''}${v.url?outLink(v.url,'來源'):''}<button data-action="edit-info" data-index="${state.info.indexOf(v)}">編輯資料</button></div>`)}
function actions(id){const {d,r,i}=getRow(id);modal(`${modalHeader('調整行程')}<p>${esc(r.name)}</p><div class="toolbar"><button data-action="shift" data-dir="-1" data-id="${id}" ${i===0?'disabled':''}>↑ 上移</button><button data-action="shift" data-dir="1" data-id="${id}" ${i===d.rows.length-1?'disabled':''}>↓ 下移</button></div><label class="field">移動／複製到<select id="targetDay">${state.days.map((x,j)=>`<option value="${j}" ${x===d?'selected':''}>D${j+1} · ${x.date.slice(5)}</option>`).join('')}</select></label><div class="modalactions"><button data-action="transfer" data-copy="false" data-id="${id}">移到該日最後</button><button data-action="transfer" data-copy="true" data-id="${id}">複製到該日</button><button class="danger" data-action="delete-row" data-id="${id}">刪除此行程</button></div>`)}

latform||'')}</select></label>${field('訂單／平台連結','name="bookingUrl"',v.bookingUrl||'','url')}<p class="muted">可貼上 Booking／KLOOK 訂單或訂房確認頁網址。</p></div>`}${area(ref?'備註':'備註／店家資訊','name="note"',v.note,'large-note')}<div class="modalactions"><button type="button" data-action="close">取消</button><button class="primary">儲存</button></div></form>`)}

function dateAdd(start,n){const d=new Date(start+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)}
function editTrip(id,copy=false){const t=id?db.trips.find(x=>x.id===id):null;modal(`${modalHeader(copy?'複製旅程':t?'旅程設定':'新增旅程')}<form id="tripForm" data-id="${id||''}" data-copy="${copy}">${field('旅程名稱','name="name"',t?t.name+(copy?'（副本）':''):'','text','required')}${field('目的地','name="destination"',t?.destination||'','text','required')}<div class="fields">${field('出發日期','name="date"',t?.days[0].date||new Date().toISOString().slice(0,10),'date','required')}${field('天數','name="count"',t?.days.length||7,'number','min="1" max="60" required')}${field('旅遊人數','name="people"',t?.people||1,'number','min="1" max="100" required')}<label class="field">費用幣別<select name="currency">${options(['JPY','TWD','USD','EUR','KRW','CNY','GBP','AUD','CAD','THB','SGD','HKD'],t?.currency||'JPY')}</select></label></div>${copy?'<p class="muted">保留行程內容，清單重設未完成。航班日期、訂位與活動資訊需重新確認。</p>':''}${t&&!copy?'<p class="muted">縮短天數若會刪除已有行程，將無法儲存；請先移動或刪除該日行程。</p>':''}<div class="modalactions"><button class="primary">儲存旅程</button></div></form>`)}
function blankFlight(){return Object.fromEntries(['airline','number','date','from','to','depart','arrive','booking','note'].map(x=>[x,'']))}
function normalizeTrip(t){t.id||=uid();t.name||='京都七天六夜';t.destination||='京都・大阪・滋賀';t.people||=3;t.currency||='JPY';t.version=3;t.luggageGroups||=[...sourcePack.groups];t.days.forEach(d=>d.rows.forEach(r=>{if(r.category==='購物')r.category='逛街';r.origin||='';r.destination||=''}));t.info.forEach(x=>x.id||=uid());t.luggage.forEach(x=>{x.category||='其他';if(!t.luggageGroups.includes(x.category))t.luggageGroups.push(x.category)});return upgradeTrip(t)}
function migrateLegacy(old){const t=normalizeTrip(structuredClone(old));const defaults=['護照','機票／訂房確認','日圓與信用卡','手機與充電線','行動電源','換洗衣物','盥洗用品','個人藥品','雨具','好走的鞋'];t.luggage=t.luggage.filter(x=>!defaults.includes(x.text));for(const v of sourcePack.luggage)if(!t.luggage.some(x=>x.text===v.text))t.luggage.push(structuredClone(v));for(const v of sourcePack.todo)if(!t.todo.some(x=>x.text===v.text))t.todo.push(structuredClone(v));for(const k of ['luggage','todo'])t[k].forEach(x=>x.done=false);t.luggageNote=(t.luggageNote||'')+'\n\n原始收藏（規定與額度待核對）：\n'+sourcePack.luggageNote;t.entryNote=(t.entryNote||'')+'\n\n原始收藏（流程待核對）：\n'+sourcePack.entryNote;for(const a of sourcePack.articles)if(!t.info.some(x=>x.sourceKey===a.sourceKey))t.info.push({...structuredClone(a),id:uid()});return normalizeTrip(t)}
function finite(v,min,max){return typeof v==='number'&&Number.isFinite(v)&&v>=min&&v<=max}
function validTrip(t){const str=v=>typeof v==='string'&&v.length<=100000;const date=v=>typeof v==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(v)&&Number.isFinite(Date.parse(v));if(t&&Array.isArray(t.days)&&Array.isArray(t.flights)&&Array.isArray(t.info))upgradeTrip(t);if(!t||!str(t.name)||!str(t.id)||!finite(t.people,1,100)||!['JPY','TWD','USD','EUR','KRW','CNY','GBP','AUD','CAD','THB','SGD','HKD'].includes(t.currency)||!Array.isArray(t.days)||t.days.length<1||t.days.length>60)throw Error('旅程設定不正確');const ids=new Set();for(const d of t.days){if(!date(d.date)||!str(d.title)||!str(d.base)||!/^([01]\d|2[0-3]):[0-5]\d$/.test(d.start)||!Array.isArray(d.rows)||d.rows.length>300)throw Error('日期資料不正確');for(const r of d.rows){if(!str(r.id)||ids.has(r.id)||!['name','place','transport','note','costNote','origin','destination','url'].every(k=>str(r[k]))||!finite(r.travelMinutes,0,1440)||!finite(r.stayMinutes,0,1440)||!finite(r.duration,0,2880)||!finite(r.gap,0,1440)||!finite(r.cost,0,10000000)||!types.includes(r.category)||!['person','group'].includes(r.costBasis)||!['transit','walking','driving'].includes(r.mode)||r.url&&!safeUrl(r.url)||r.mapLink&&!safeUrl(r.mapLink))throw Error('行程資料不正確');ids.add(r.id)}}for(const k of ['luggage','todo'])if(!Array.isArray(t[k])||!t[k].every(x=>str(x.text)&&typeof x.done==='boolean'))throw Error('清單格式不正確');if(!Array.isArray(t.luggageGroups)||!t.luggageGroups.every(str)||t.luggage.some(x=>!t.luggageGroups.includes(x.category)))throw Error('分類格式不正確');if(!Array.isArray(t.info)||!t.info.every(x=>['id','name','note','place','url','type'].every(k=>str(x[k]))&&(!x.url||safeUrl(x.url))&&(!x.bookingUrl||safeUrl(x.bookingUrl))&&(x.amount==null||x.amount===''||Number.isFinite(Number(x.amount))&&Number(x.amount)>=0)))throw Error('資訊格式不正確');if(!Array.isArray(t.refs)||!t.refs.every(x=>str(x.title)&&str(x.note)&&str(x.rowId)&&safeUrl(x.url)))throw Error('收藏格式不正確');if(!Array.isArray(t.flights)||t.flights.length!==2||!t.flights.every(x=>Object.keys(blankFlight()).every(k=>str(x[k]))))throw Error('航班格式不正確');if(!Array.isArray(t.food)||!t.food.every(x=>['id','name','area','category','place','mapUrl','tabelogUrl','note','checkedOn'].every(k=>str(x[k]))&&finite(x.rating,4,5)&&Number.isInteger(x.reviews)&&x.reviews>=100&&(!x.mapUrl||safeUrl(x.mapUrl))&&(!x.tabelogUrl||safeUrl(x.tabelogUrl))))throw Error('餐廳收藏格式不正確');if(!str(t.luggageNote)||!str(t.entryNote))throw Error('注意事項格式不正確');return t}
function validDb(d){if(!d||d.version!==3||!Array.isArray(d.trips)||!d.trips.length||d.trips.length>100)throw Error('備份版本或旅程數量不正確');d.trips.forEach(validTrip);if(new Set(d.trips.map(t=>t.id)).size!==d.trips.length)throw Error('旅程代碼重複');if(!d.template||!Array.isArray(d.template.groups)||!Array.isArray(d.template.items)||typeof d.template.note!=='string'||!d.template.groups.every(x=>typeof x==='string')||!d.template.items.every(x=>typeof x.text==='string'&&d.template.groups.includes(x.category)))throw Error('範本格式不正確');return d}
function importState(raw){let next,single=false;try{const parsed=JSON.parse(raw);if(parsed.version===2){next=migrateLegacy(parsed);validTrip(next);single=true}else if(parsed.version===3&&parsed.kind==='trip'){next=validTrip(parsed.trip);single=true}else next=validDb(parsed)}catch(e){toast('無法匯入：'+e.message);return}confirmAction('匯入備份',single?'此備份將加入旅程清單，保留現有旅程。':'將取代全部旅程與共用範本；請先匯出目前資料。',()=>{if(single){next=structuredClone(next);next.id=uid();db.trips.push(next);db.activeId=next.id}else db=next;dayIndex=0;active()})}
function download(){const scope=$('#exportScope')?.value||'all',payload=backupPayload(scope),url=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download=`${scope==='all'?'全部旅程':state.name}-備份-${new Date().toISOString().slice(0,10)}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('備份已匯出')}
function printOptions(){modal(`${modalHeader('列印／另存 PDF')}<form id="printForm"><h3>選擇日期</h3>${state.days.map((d,i)=>`<label class="print-check"><input type="checkbox" name="day" value="${i}" checked> D${i+1} · ${d.date} · ${esc(d.title)}</label>`).join('')}<div class="toolbar"><button type="button" data-action="select-print-days">全選</button><button type="button" data-action="clear-print-days">清除日期</button></div><h3>附加資料</h3>${[['flights','航班與入境'],['info','住宿與旅途資訊'],['lists','行李與待辦'],['refs','收藏網址']].map(([v,l])=>`<label class="print-check"><input type="checkbox" name="extra" value="${v}"> ${l}</label>`).join('')}<div class="modalactions"><button class="primary">開啟列印</button></div></form>`)}

function createTrip(values,original,copy){const count=Number(values.count),people=Number(values.people);if(!Number.isInteger(count)||count<1||count>60||!Number.isInteger(people)||people<1||people>100||!values.date)throw Error('請確認日期、天數與人數');if(original&&!copy&&original.days.slice(count).some(d=>d.rows.length))throw Error('縮短的日期仍有行程，請先移動或刪除');const trip=original?structuredClone(original):{id:uid(),version:3,days:[],info:[],refs:[],todo:[],luggage:db.template.items.map(x=>({...x,done:false})),luggageGroups:[...db.template.groups],luggageNote:db.template.note,entryNote:'',flights:[blankFlight(),blankFlight()]};Object.assign(trip,{name:values.name.trim(),destination:values.destination.trim(),people,currency:values.currency});if(copy){trip.id=uid();const idMap=new Map();trip.days.forEach(d=>d.rows.forEach(r=>{const id=uid();idMap.set(r.id,id);r.id=id}));trip.refs.forEach(r=>r.rowId=idMap.get(r.rowId)||'');trip.info.forEach(x=>x.id=uid());(trip.food||[]).forEach(x=>x.id=uid());['luggage','todo'].forEach(k=>trip[k].forEach(x=>x.done=false));trip.flights=trip.flights.map(f=>({...f,number:'',booking:'',depart:'',arrive:'',note:'由原旅程複製，航班與機場請重新確認。'}))}trip.days=Array.from({length:count},(_,i)=>({...trip.days[i]||{title:'新的一天',start:'09:00',base:'',rows:[]},date:dateAdd(values.date,i)}));if(copy||!original){trip.flights[0].date=trip.days[0].date;trip.flights[1].date=trip.days.at(-1).date}return validTrip(trip)}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const ds=b.dataset;if(ds.tab){if($('#modal').open)close();go(ds.tab);return}if(ds.scheduleMode){scheduleMode=ds.scheduleMode;render();return}if(ds.listMode){listMode=ds.listMode;render();return}const id=ds.id,i=Number(ds.index);switch(ds.action){case 'gh-sync':ghPush().then(()=>{if(!ghDirty)ghPoll()}).catch(()=>{});break;case 'gh-initialize':ghConfirm('建立 GitHub 共用資料','把目前顯示的旅程寫入指定 JSON；若檔案已存在，會讀取既有版本。',()=>{ghInitialize()});break;case 'gh-forget':ghToken='';ghReady=false;try{sessionStorage.removeItem(GH_TOKEN_KEY)}catch{}close();$('#modalBody').innerHTML='';render();ghSetMessage('已清除授權，私人行程已隱藏');break;case 'gh-reload':if(ghBusy){toast('同步中，請稍後');break}ghConfirm('重新載入 GitHub 資料','此手機尚未同步的修改會被取代。請先按下載備份保留。',()=>{ghDirty=false;ghConflict=false;ghRememberDraft();ghConnect()});break;case 'download-html':downloadHtml();break;case 'table-add':snapshot();state.days[dayIndex].rows.push(blankRow());tableCommit();break;case 'table-duplicate':{const {d,r,i}=getRow(id);snapshot();d.rows.splice(i+1,0,{...structuredClone(r),id:uid()});tableCommit();break}case 'table-shift':{const {d,i}=getRow(id),j=i+Number(ds.dir);if(j<0||j>=d.rows.length)return;snapshot();[d.rows[i],d.rows[j]]=[d.rows[j],d.rows[i]];tableCommit();break}case 'table-transfer':{const target=Number(b.closest('[data-table-id]').querySelector('[data-table-target]').value);moveRow(id,target,ds.copy==='true');toast('行程已調整，時間與路線已重算');break}case 'back-page':backPage();break;case 'edit-flight':editFlight(i);break;case 'copy-link':copyLink(b);break;case 'close':close();break;case 'prev-day':dayIndex=Math.max(0,dayIndex-1);render();break;case 'next-day':dayIndex=Math.min(state.days.length-1,dayIndex+1);render();break;case 'add-row':snapshot();{const r=blankRow();state.days[dayIndex].rows.push(r);commit();editRow(r.id)}break;case 'edit':editRow(id);break;case 'detail':detail(id);break;case 'article':article(id);break;case 'actions':actions(id);break;case 'open-row':dayIndex=state.days.indexOf(getRow(id).d);close();go('trip');setTimeout(()=>document.querySelector(`[data-table-id="${id}"]`)?.scrollIntoView({block:'center'}),0);break;case 'shift':{const {d,i}=getRow(id),j=i+Number(ds.dir);if(j<0||j>=d.rows.length)return;snapshot();[d.rows[i],d.rows[j]]=[d.rows[j],d.rows[i]];close();commit();break}case 'transfer':moveRow(id,Number($('#targetDay').value),ds.copy==='true');close();toast('行程已調整，時間與路線已重算');break;case 'delete-row':confirmAction('刪除行程',getRow(id).r.name,()=>{const {d,i}=getRow(id);d.rows.splice(i,1)});break;case 'undo':if(undoState){[db,undoState]=[undoState,structuredClone(db)];active();commit();toast('已復原')}break;case 'add-check':editCheck(ds.kind,null,ds.category);break;case 'edit-check':editCheck(ds.kind,i);break;case 'delete-check':confirmAction('刪除項目',state[ds.kind][i].text,()=>state[ds.kind].splice(i,1));break;case 'add-category':editCategory();break;case 'edit-category':editCategory(i);break;case 'delete-category':confirmAction('刪除分類','此分類的項目會移到「其他」，保留勾選狀態。',()=>{const c=state.luggageGroups[i];if(c==='其他'&&state.luggage.some(x=>x.category===c)){toast('請先移動「其他」分類的項目');return}state.luggageGroups.splice(i,1);state.luggage.filter(x=>x.category===c).forEach(x=>x.category='其他');if(state.luggage.some(x=>x.category==='其他')&&!state.luggageGroups.includes('其他'))state.luggageGroups.push('其他')});break;case 'save-template':confirmAction('更新共用行李範本','將目前分類與項目存為新旅程的行李範本，完成狀態不納入。',()=>{db.template={groups:[...state.luggageGroups],items:state.luggage.map(x=>({...x,done:false})),note:state.luggageNote}});break;case 'add-info':editRecord('info');break;case 'add-shop':editRecord('info',null,ds.parentKey);break;case 'edit-info':editRecord('info',i);break;case 'add-ref':editRecord('ref');break;case 'edit-ref':editRecord('ref',i);break;case 'delete-info':confirmAction('刪除資訊',state.info[i].name,()=>{const removed=state.info.splice(i,1)[0];state.info.filter(x=>x.parentKey===removed.sourceKey).forEach(x=>{x.parentKey='';x.sourceKey||='area-'+x.id})});break;case 'delete-ref':confirmAction('刪除收藏',state.refs[i].title,()=>state.refs.splice(i,1));break;case 'new-trip':editTrip();break;case 'edit-trip':editTrip(id);break;case 'duplicate-trip':editTrip(id,true);break;case 'switch-trip':db.activeId=id;dayIndex=0;budgetMode=1;infoType='全部';active();go('trip');save();break;case 'delete-trip':confirmAction('刪除旅程',db.trips.find(x=>x.id===id).name,()=>{if(db.trips.length>1)db.trips=db.trips.filter(x=>x.id!==id)});break;case 'expand-book':document.querySelectorAll('.book-day,.book-extra').forEach(el=>el.open=true);break;case 'collapse-book':document.querySelectorAll('.book-day,.book-extra').forEach(el=>el.open=false);break;case 'print-options':printOptions();break;case 'select-print-days':case 'clear-print-days':$('#printForm').querySelectorAll('[name="day"]').forEach(x=>x.checked=ds.action==='select-print-days');break;case 'download':download();break;case 'copy':{const text=JSON.stringify(backupPayload($('#exportScope').value),null,2);if(navigator.clipboard)navigator.clipboard.writeText(text).then(()=>toast('已複製')).catch(()=>{const el=$('#exportText');el.value=text;el.closest('details').open=true;el.select();toast('請手動複製備份文字')});else {const el=$('#exportText');el.value=text;el.closest('details').open=true;el.select()}break}case 'import':importState($('#importText').value);break}});
document.addEventListener('change',async e=>{const el=e.target,ds=el.dataset;if(ds.tableRow){saveTableCell(el)}else if(ds.tableDay){saveTableDay(el)}else if(el.id==='infoRecordType'){$('#hotelFields').hidden=el.value!=='住宿';$('#shopParentField').hidden=el.value!=='逛街';autoSize()}else if(el.hasAttribute('data-select-day')){dayIndex=Number(el.value);render()}else if(el.hasAttribute('data-budget')){budgetMode=Number(el.value);render()}else if(el.hasAttribute('data-info-type')){infoType=el.value;render()}else if(ds.dayField){if(ds.dayField==='start'&&!/^([01]\d|2[0-3]):[0-5]\d$/.test(el.value)){toast('請填有效的出發時間');render();return}snapshot();state.days[dayIndex][ds.dayField]=el.value;commit()}else if(ds.flight!=null){state.flights[Number(ds.flight)][ds.key]=el.value;save()}else if(ds.stateKey){state[ds.stateKey]=el.value;save()}else if(ds.check){state[ds.check][Number(ds.index)].done=el.checked;commit()}else if(el.id==='importFile'&&el.files[0]){if(el.files[0].size>5000000){toast('備份檔過大');return}importState(await el.files[0].text());el.value=''}});
document.addEventListener('input',e=>{const el=e.target,ds=el.dataset;if(ds.flight!=null){state.flights[Number(ds.flight)][ds.key]=el.value;save()}else if(ds.stateKey){state[ds.stateKey]=el.value;save()}if(el.classList.contains('table-text')){el.style.height='auto';el.style.height=Math.min(220,Math.max(58,el.scrollHeight+2))+'px';return}if(el.tagName==='TEXTAREA'&&!el.classList.contains('backuptext')&&!el.classList.contains('flight-note')&&!el.classList.contains('entry-note')){el.style.height='auto';el.style.height=Math.max(el.classList.contains('large-note')?240:100,el.scrollHeight+4)+'px'}});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target,data=new FormData(f),v=Object.fromEntries(data);try{if(f.id==='githubForm'){ghConfigure(v).catch(e=>toast(e.message));return}if(!ghReady||!ghToken)throw Error('請先到 GitHub 設定連線與編輯授權');if(f.id==='flightForm'){const index=Number(f.dataset.index);if(!state.flights[index])throw Error('找不到航班');snapshot();state.flights[index]={...state.flights[index],...v};close();commit()}else if(f.id==='rowForm'){if(v.url&&!safeUrl(v.url)||v.mapLink&&!safeUrl(v.mapLink))throw Error('請填有效的 http 或 https 網址');v.name=v.name.trim();v.place=v.place.trim()||v.name;if(!v.name)throw Error('請填入行程名稱');const {r,d,i}=getRow(f.dataset.id),tt=times(d),start=i===0?v.start:d.start;if(!/^([01]\d|2[0-3]):[0-5]\d$/.test(start))throw Error('開始時間格式不正確');v.gap=0;delete v.start;for(const key of ['travelMinutes','stayMinutes','gap','cost'])v[key]=Number(v[key]);v.duration=v.travelMinutes+v.stayMinutes;if(!finite(v.travelMinutes,0,1440)||!finite(v.stayMinutes,0,1440)||!finite(v.gap,0,1440)||!finite(v.cost,0,10000000))throw Error('請填入有效的時長與費用');const proposed=structuredClone(state),pd=proposed.days[state.days.indexOf(d)];if(i===0)pd.start=start;Object.assign(pd.rows[i],v);validTrip(proposed);snapshot();if(i===0)d.start=start;Object.assign(r,v);close();commit()}else if(f.id==='recordForm'){const key=f.dataset.kind==='ref'?'refs':'info';if(v.url&&!safeUrl(v.url)||v.bookingUrl&&!safeUrl(v.bookingUrl))throw Error('網址格式不正確');if(key==='info'){if(v.amount!==''&&v.amount!=null&&(!Number.isFinite(Number(v.amount))||Number(v.amount)<0))throw Error('請填有效的金額');if(v.type!=='逛街')v.parentKey='';if(v.type==='逛街'&&!v.parentKey)v.sourceKey=(f.dataset.index!==''?state.info[Number(f.dataset.index)]?.sourceKey:'')||'area-'+uid();if(v.type==='住宿')v.hotelFieldsMigrated=true}snapshot();if(f.dataset.index===''){if(key==='info')v.id=uid();state[key].push(v)}else Object.assign(state[key][Number(f.dataset.index)],v);close();commit()}else if(f.id==='checkForm'){v.text=v.text.trim();if(!v.text)throw Error('請填項目名稱');const key=f.dataset.kind;snapshot();if(f.dataset.index==='')state[key].push({...v,done:false});else Object.assign(state[key][Number(f.dataset.index)],v);close();commit()}else if(f.id==='categoryForm'){v.name=v.name.trim();if(!v.name)throw Error('請填分類名稱');const i=f.dataset.index===''?null:Number(f.dataset.index);if(state.luggageGroups.includes(v.name)&&(i==null||state.luggageGroups[i]!==v.name))throw Error('分類名稱已存在');snapshot();if(i==null)state.luggageGroups.push(v.name);else {const old=state.luggageGroups[i];state.luggageGroups[i]=v.name;state.luggage.filter(x=>x.category===old).forEach(x=>x.category=v.name)}close();commit()}else if(f.id==='tripForm'){const original=db.trips.find(x=>x.id===f.dataset.id),copy=f.dataset.copy==='true',t=createTrip(v,original,copy);snapshot();if(original&&!copy)db.trips[db.trips.indexOf(original)]=t;else db.trips.push(t);db.activeId=t.id;dayIndex=0;budgetMode=1;active();close();go('trip');save()}else if(f.id==='printForm'){const selection={days:data.getAll('day'),extras:data.getAll('extra')};if(!selection.days.length&&!selection.extras.length)throw Error('請至少選一個日期或附加資料');close();preparePrint(selection);setTimeout(()=>window.print(),100)}}catch(err){toast(err.message)}});
document.addEventListener('toggle',e=>{if(e.target.tagName==='DETAILS'&&e.target.open)autoSize()},true);
window.addEventListener('resize',()=>{if(tab==='schedule')layoutSchedules()});
function registerTools(){if(!document.modelContext?.registerTool)return;for(const tool of [{name:'read_travel_itinerary',description:'Read the active travel itinerary.',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true},execute:()=>({trip:state.name,days:state.days.map(d=>({date:d.date,title:d.title,rows:d.rows.map((r,i)=>({id:r.id,name:r.name,...times(d)[i]}))}))})},{name:'move_travel_item',description:'Move or copy an item to another day in the current journey.',inputSchema:{type:'object',properties:{id:{type:'string'},day:{type:'integer',minimum:1},copy:{type:'boolean'}},required:['id','day','copy'],additionalProperties:false},execute:input=>{if(typeof input.id!=='string'||!Number.isInteger(input.day)||input.day<1||input.day>state.days.length||typeof input.copy!=='boolean')throw Error('Invalid input');moveRow(input.id,input.day-1,input.copy);return {updated:true}}}]){try{Promise.resolve(document.modelContext.registerTool(tool)).catch(()=>{})}catch{}}}
async function init(){try{sourcePack=JSON.parse(document.getElementById('travel-sources').textContent);db=validDb(JSON.parse(document.getElementById('travel-initial').textContent));active();ghLoadConfig();render();if(ghConfig&&ghToken)await ghConnect();else ghSetMessage('請設定私人儲存庫與授權碼，才能瀏覽及修改行程')}catch(err){$('#main').innerHTML='<section class="card"><h2>設定未能載入</h2><p>'+esc(err.message)+'</p></section>'}}
init();

window.addEventListener('online',()=>{ghPush().then(()=>ghPoll()).catch(()=>{})});
</script></body></html>
